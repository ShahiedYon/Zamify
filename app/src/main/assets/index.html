 if(q.kind==='single'||q.kind==='multi')detail=order.map((i,j)=>{let correct=q.kind==='single'?i===q.answer:q.answer.includes(i);return`<div class="rationale ${correct?'right':''}"><h3><span class="${correct?'score':'muted'}">${correct?'✓ Correct':'× Incorrect'}</span> · ${'ABCDE'[j]}. ${esc(q.options[i])}</h3><p class="muted">${esc(q.reasons[i])}</p></div>`}).join('');
 if(q.kind==='order')detail='<h3>Correct sequence</h3><ol>'+q.answer.map(i=>`<li class="rationale right"><strong>${esc(q.options[i])}</strong><p class="muted">${esc(q.reasons[i])}</p></li>`).join('')+'</ol>';
 if(q.kind==='match')detail=q.prompts.map((label,i)=>`<div class="rationale ${a.choice[i]===q.answer[i]?'right':''}"><h3>${esc(label)}</h3><p><strong>Correct: ${esc(q.options[q.answer[i]])}</strong></p>${a.choice[i]!==q.answer[i]?`<p class="warning">Your match: ${esc(q.options[a.choice[i]])}</p>`:''}<p class="muted">${esc(q.reasons[q.answer[i]])}</p></div>`).join('');
 return`<section class="feedback ${a.correct?'':'bad'}" aria-label="Answer feedback" role="status"><h2>${a.correct?'✓ Correct — check the insight.':'Let’s work through this.'}</h2><p>${a.correct?'Check the explanation to strengthen your understanding.':'A useful chance to spot the difference between the options.'}</p>${q.kind!=='single'?'<p class="small">All selections, positions or pairs must be correct to earn the point.</p>':''}${a.assisted?'<p class="small warning">Hint used · This stays in review until you answer correctly without help.</p>':''}</section><section class="card coach clue-card"><h2>Key insight · spot the clue</h2>${q.clues.map(c=>`<p><mark>${esc(c.text)}</mark><br><span class="muted">${esc(c.why)}</span></p>`).join('')}</section><section class="card coach"><h2>Why this answer fits</h2><p>${esc(q.why)}</p><details><summary>How to analyse this question</summary><p class="muted">${esc(q.analysis)}</p><h3>The trap to avoid</h3><p class="muted">${esc(q.trap)}</p></details></section><section class="card coach"><details><summary>${q.kind==='order'?'Why this sequence works':q.kind==='match'?'Understand each match':'Why the other answers don’t fit'}</summary>${detail}</details><a class="small" href="${q.source||SOURCE(q.domain)}" target="_blank" rel="noopener">Official AWS reference ↗</a></section>`;
}
function quiz(){
 let s=state.session;if(!s){tab='home';return home()}let q=currentQuestion(),a=s.answers[s.index],hinted=s.assisted.includes(q.id),order=orderFor(q),controls='',choice=a?a.choice:selected;
 let label={single:'Select one answer',multi:'Select exactly '+q.answer.length+' answers',order:'Arrange all steps in the correct order',match:'Match each prompt once — use each option once'}[q.kind];
 if(q.kind==='single'||q.kind==='multi')controls=`<div role="group" aria-label="Answer choices">${order.map((i,j)=>{let chosen=q.kind==='single'?choice===i:Array.isArray(choice)&&choice.includes(i),correct=q.kind==='single'?q.answer===i:q.answer.includes(i);return`<button class="option ${a?(correct?'correct':chosen?'wrong':''):chosen?'chosen':''}" data-choice="${i}" aria-pressed="${Boolean(chosen)}" ${a?'disabled':''}><span class="letter">${'ABCDE'[j]}</span><span>${esc(q.options[i])}${a&&correct?' ✓ Correct answer':a&&chosen?' · Your answer':''}</span></button>`}).join('')}</div>${q.kind==='multi'&&!a?`<p class="small muted">${Array.isArray(selected)?selected.length:0} selected · exactly ${q.answer.length} required</p>`:''}`;
 if(q.kind==='order'){let sequence=Array.isArray(choice)?choice:[];controls=`<section class="card"><h2>Your sequence</h2>${sequence.length?'<ol>'+sequence.map((i,j)=>`<li>${esc(q.options[i])}${!a?` <button class="inline" data-remove="${j}" aria-label="Remove step ${j+1}">Remove</button>`:''}</li>`).join('')+'</ol>':'<p class="muted">Tap the steps below in the order they should happen.</p>'}</section>${!a?order.filter(i=>!sequence.includes(i)).map(i=>`<button class="option" data-choice="${i}"><span class="letter">+</span>${esc(q.options[i])}</button>`).join(''):''}`;}
 if(q.kind==='match'){let pairs=Array.isArray(choice)?choice:[];controls=q.prompts.map((prompt,i)=>`<div class="match-row"><label for="pair-${i}">${esc(prompt)}</label><select id="pair-${i}" data-pair="${i}" ${a?'disabled':''}><option value="">Choose a match</option>${order.map(j=>`<option value="${j}" ${pairs[i]===j?'selected':''}>${esc(q.options[j])}</option>`).join('')}</select></div>`).join('')+(!a?'<p class="small muted">Each option must be used once. Duplicate matches must be corrected before submitting.</p>':'');}
 paint(`<section class="quiz"><div class="row"><button class="quiet" data-action="exit">← Save & exit</button><span class="small muted">${s.index+1} of ${s.ids.length}</span></div><div class="bar"><span style="width:${(s.index+(a?1:0))/s.ids.length*100}%"></span></div><div class="spacer"></div><div class="module-cue">${ZAMI}<span>Zami: You’re in <strong>${esc(DOMAINS[q.domain-1])}</strong>.<br>AWS AI Practitioner · Module ${q.domain} of 5</span></div><span class="eyebrow">${esc(s.title)}</span><p class="small muted">${DOMAINS[q.domain-1]} · ${label}</p><h1>${highlighted(q,Boolean(a)||hinted)}</h1>${!a?hinted?`<aside class="hint" role="status"><strong>Think about this</strong><p>${esc(q.hint)}</p><p class="small muted">${esc(q.clues[0].why)}</p></aside>`:'<button class="quiet" data-action="hint">Give me a hint</button>':''}${controls}${a?coaching(q,a)+`<button class="btn" style="width:100%" data-action="next">${s.index+1===s.ids.length?'See my results':'Next question →'}</button>`:`<div class="spacer"></div><button class="btn" style="width:100%" data-action="check" ${!ready(q)?'disabled':''}>Check answer</button>`}</section>`);
}
function hint(){let s=state.session;if(!s||s.answers[s.index])return;let id=s.ids[s.index];if(!s.assisted.includes(id))s.assisted.push(id);save();quiz()}
function check(){let s=state.session,q=currentQuestion();if(!s||!q||!ready(q)||s.answers[s.index])return;if(!pool().some(item=>item.id===q.id))return go('packs');let a={id:q.id,choice:Array.isArray(selected)?[...selected]:selected,correct:grade(q,selected),assisted:s.assisted.includes(q.id),at:Date.now()};s.answers.push(a);state.attempts.push(a);if(a.correct&&!a.assisted)state.missed=state.missed.filter(id=>id!==q.id);else if(!state.missed.includes(q.id))state.missed.push(q.id);save();quiz();document.querySelector('.feedback')?.scrollIntoView?.({block:'start'});}
function next(){let s=state.session;if(!s||!s.answers[s.index])return;if(s.index+1<s.ids.length){s.index++;selected=null;save();quiz();topOfPage()}else{let n=s.answers.filter(a=>a.correct).length,title=s.title,count=s.ids.length,assisted=s.answers.filter(a=>a.assisted).length,unassisted=s.answers.filter(a=>a.correct&&!a.assisted).length,review=s.answers.filter(a=>!a.correct||a.assisted);state.session=null;save();tab='results';paint(`<section class="quiz"><div class="result-head"><div class="mascot"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M22 53c0-24 15-37 38-37s38 13 38 37v32c0 12-7 18-16 18-7 0-10-5-16-5s-9 5-16 5c-9 0-28-4-28-18Z" fill="#DADCF8"/><path d="M47 32h23L49 47h23" fill="none" stroke="#6269B9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 61v7M76 61v7" stroke="#252B47" stroke-width="5" stroke-linecap="round"/><path d="M52 79q8 7 16 0" fill="none" stroke="#252B47" stroke-width="3" stroke-linecap="round"/></svg></div><div class="eyebrow">SESSION COMPLETE</div><h1>One step clearer.</h1><p class="muted small">${esc(title)}</p></div><section class="hero result-hero"><span class="section-label">Your practice score</span><div class="result-donut" style="--result:${n/count*100}%"><div><span class="large score">${Math.round(n/count*100)}%</span><small>Practice accuracy</small></div></div><p class="muted">${n} of ${count} correct</p></section><div class="result-grid"><section class="card"><span class="eyebrow">Independent recall</span><strong>${unassisted}/${count}</strong><small>Correct without hints</small></section><section class="card"><span class="eyebrow">Learning support</span><strong>${assisted}</strong><small>Hint-assisted answers</small></section></div>${review.length?`<section class="card"><h2>Your next learning wins</h2><p class="small muted">Revisit these without a hint to check your understanding.</p>${review.map(a=>{let q=BANK.find(q=>q.id===a.id);return`<button class="result-item" data-review-id="${q.id}">${esc(q.q)}<span>${a.assisted&&a.correct?'Hint used':'Needs review'} · Review this question →</span></button>`}).join('')}</section>`:'<section class="card"><h2>A strong session.</h2><p class="muted small">Explain one concept in your own words, then return later to test your recall.</p></section>'}<div class="spacer"></div><div class="actions"><button class="btn" data-action="review" ${!eligibleMisses().length?'disabled':''}>Review (${eligibleMisses().length})</button><button class="btn secondary" data-tab="home">Back to home</button></div><p class="notice">This is a raw practice score, not an AWS scaled score or a pass prediction. Repeating the same bank can reflect familiarity.</p></section>`);topOfPage()}}
function learn(){paint(`<div class="eyebrow">READ · REASON · REVIEW</div><h1>Learn to choose.</h1><section class="card coach"><h2>A repeatable question routine</h2><ol><li><strong>Read the ask.</strong> Identify the requested output and whether it asks for BEST, LEAST, NOT or multiple answers.</li><li><strong>Find the constraints.</strong> Fresh data, latency, permissions, cost and operational effort can change the answer.</li><li><strong>Predict the capability.</strong> Say what is needed before matching a service name.</li><li><strong>Eliminate with a reason.</strong> Reject choices that solve a different task or violate an explicit condition.</li><li><strong>Compare the finalists.</strong> Choose the option satisfying the whole scenario, then explain why the closest alternative fails.</li></ol><p class="small muted">Clues support reasoning; no single keyword always determines the answer. Hints are for learning, not a feature of the real exam.</p></section><h2>Concept cards</h2><label class="small muted" for="search">Find a concept</label><input id="search" class="search" type="search" placeholder="Try RAG, recall or MCP"><div id="glossary"></div>`);filterGloss('')}
function filterGloss(term){let rows=GLOSS.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(term.toLowerCase()));document.querySelector('#glossary').innerHTML=rows.length?rows.map(x=>`<article class="card gloss"><h2>${esc(x[0])}</h2><p class="muted">${esc(x[1])}</p><a class="small" href="${SOURCE(x[2])}" target="_blank" rel="noopener">AWS topic guide ↗</a></article>`).join(''):'<p class="muted">No matching concept. Try a shorter term.</p>'}
function progress(){let m=metrics(),a=accessibleAttempts(),unassisted=a.filter(x=>!x.assisted),p=unassisted.length?Math.round(unassisted.filter(x=>x.correct).length/unassisted.length*100):null;paint(`<div class="eyebrow">YOUR LEARNING TRAIL</div><h1>Understanding grows.</h1><p class="muted">${state.previewFullPack?'Full-pack demo':'Free pack'} · Progress stays on this device.</p><div class="stats">${stat(m.n,'Answers submitted')}${stat(p===null?'—':p+'%','Without-hint accuracy')}${stat(visited()+'/'+pool().length,'Unique questions')}</div><section class="card"><h2>Your strengths &amp; focus areas</h2><p class="small muted">Latest-answer accuracy, including answers with hints. Revisit without help to check your recall.</p>${DOMAINS.map((d,i)=>{let x=latestDomain(i+1);return`<div style="margin:23px 0"><div class="row"><span>${d}</span><strong>${x.n?x.p+'%':'—'}</strong></div><div class="bar"><span style="width:${x.p}%"></span></div><span class="small muted">${x.n}/${domainCount(i+1)} explored · ${!x.n?'Not started':x.p===100?'Correct so far':x.p>=70?'Building confidence':'Needs another look'}</span></div>`}).join('')}</section><div class="spacer"></div><div class="actions"><button class="btn" data-action="all">Practice all ${pool().length}</button><button class="btn secondary" data-action="review" ${!eligibleMisses().length?'disabled':''}>Review mistakes (${eligibleMisses().length})</button></div><p class="notice">Practice results are not an exam-readiness estimate. Progress from the other preview pack is retained but hidden here.</p>`)}
function about(){paint(`<div class="eyebrow">BUILT FOR YOUR NEXT STEP</div><h1>Study simply.</h1><section class="card"><h2>Zamify · 0.8 preview</h2><button class="btn secondary" data-action="welcome">Replay Zami’s welcome</button><details><summary>Developer preview tools</summary><p class="small muted">Test access only. This does not represent a purchase or a production content lock.</p><button class="btn secondary" data-action="demo">Preview full pack — no payment</button></details><p class="muted">Independent preparation for AWS Certified AI Practitioner (AIF-C01). Not affiliated with or endorsed by AWS.</p><details open><summary>Free and full packs</summary><p class="muted small">Free: the same 10 reusable questions. Planned paid pack: 65 total questions, including the free 10. Every question includes hints, clues, all-option rationales and a common trap. This prototype uses clearly labeled demo access, not Google Play Billing.</p><button class="btn secondary" data-action="packs">View study packs</button></details><details><summary>Content and sources</summary><p class="muted small">65 original questions reviewed against AWS references on 24 October 2026. Includes 57 single-answer, 4 multiple-response, 2 ordering and 2 matching questions. Review is AI-assisted, not an independent expert certification. This is a practice pack, not a comprehensive exam simulator.</p><a href="${BASE}ai-practitioner-01.html" target="_blank" rel="noopener">Official AWS exam guide ↗</a></details><details><summary>Your privacy</summary><p class="muted small">Answers, hint usage and sessions are stored locally. No account, analytics or AI API calls. Opening a source link launches an external browser. Clearing local data removes progress; Android cloud backup is disabled.</p></details><details><summary>Why explanations?</summary><p class="muted small">Answer-by-answer feedback and concept-based explanations guide the design. The app teaches a method for understanding the scenario; it does not promise that memorizing keywords will pass an exam.</p></details></section><div class="spacer"></div><button class="btn secondary" data-action="reset">${resetArmed?'Confirm: erase all local progress':'Reset local progress'}</button>${resetArmed?'<p class="notice warning">Tap again to erase all answers, hint usage and saved sessions. Demo access also resets to free.</p>':''}`)}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab)return go(b.dataset.tab);if(b.dataset.reviewId)return reviewOne(Number(b.dataset.reviewId));if(b.dataset.domain)return start('domain',Number(b.dataset.domain));if(b.dataset.choice!==undefined)return choose(Number(b.dataset.choice));if(b.dataset.remove!==undefined){if(Array.isArray(selected))selected.splice(Number(b.dataset.remove),1);return quiz()}switch(b.dataset.action){case'welcome':go('catalog');return showWelcome(true);case'smart':return smartSprint();case'sprint':return start('sprint');case'all':return start('all');case'review':return start('review');case'resume':tab='quiz';quiz();return topOfPage();case'exit':return go('home');case'check':return check();case'hint':return hint();case'next':return next();case'packs':return go('packs');case'demo':return saveTier(true);case'free':return saveTier(false);case'reset':if(!resetArmed){resetArmed=true;return about()}state=fresh();save();return go('catalog')}});
document.addEventListener('change',e=>{if(e.target.dataset.pair!==undefined){if(!Array.isArray(selected))selected=[];selected[Number(e.target.dataset.pair)]=e.target.value===''?null:Number(e.target.value);quiz()}});
document.addEventListener('input',e=>{if(e.target.id==='search')filterGloss(e.target.value)});
function syncKeyboardViewport(){
 const editing=document.activeElement?.matches('input,textarea,select,[contenteditable="true"]');
 document.body.classList.toggle('editing',Boolean(editing));
 const view=window.visualViewport;
 if(editing&&view&&view.height<window.innerHeight-80)document.body.style.setProperty('--visible-height',Math.round(view.height)+'px');
 else document.body.style.removeProperty('--visible-height');
}
document.addEventListener('focusin',syncKeyboardViewport);
document.addEventListener('focusout',()=>setTimeout(syncKeyboardViewport,0));
window.visualViewport?.addEventListener('resize',syncKeyboardViewport);
window.appBack=()=>{if(document.querySelector('#zami-welcome')){finishWelcome();return true;}if(tab==='catalog')return false;go(tab==='quiz'?'home':'catalog');return true};
let welcomeTimer=null,welcomeExitTimer=null,welcomeShown=false;
function finishWelcome(){
 const overlay=document.querySelector('#zami-welcome');if(!overlay||overlay.classList.contains('leaving'))return;
 clearTimeout(welcomeTimer);document.removeEventListener('visibilitychange',welcomeVisibility);overlay.classList.add('leaving');
 const done=()=>{overlay.remove();document.querySelectorAll('.shell,.nav').forEach(el=>el.inert=false);document.removeEventListener('keydown',welcomeKey);document.querySelector('#main')?.classList.add('home-arrive');document.querySelector('#main')?.focus({preventScroll:true});};
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)done();else welcomeExitTimer=setTimeout(done,220);
}
function welcomeKey(e){if(e.key==='Escape'){e.preventDefault();finishWelcome()}}
function showWelcome(force=false){
 if(!document.createElement||!document.body||document.querySelector('#zami-welcome'))return;
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 if(!force&&welcomeShown)return;welcomeShown=true;
 let overlay=document.createElement('section');overlay.id='zami-welcome';overlay.className='welcome-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-labelledby','welcome-title');overlay.setAttribute('aria-describedby','welcome-line');
 const spark='<svg viewBox="0 0 30 30" aria-hidden="true"><path d="m15 0 4 11 11 4-11 4-4 11-4-11L0 15l11-4Z" fill="currentColor"/></svg>';
 overlay.innerHTML=`<div class="welcome-stage" aria-hidden="true"><div class="welcome-zami">${ZAMI}</div><span class="welcome-spark one">${spark}</span><span class="welcome-spark two">${spark}</span></div><h1 class="welcome-title" id="welcome-title">Zamify</h1><p class="welcome-line" id="welcome-line">A little practice. A big next step.</p><div class="welcome-progress" aria-hidden="true"><span></span></div><button class="welcome-skip" type="button">Let’s go →</button>`;
 document.querySelectorAll('.shell,.nav').forEach(el=>el.inert=true);document.body.appendChild(overlay);overlay.querySelector('button').addEventListener('click',finishWelcome);document.addEventListener('keydown',welcomeKey);document.addEventListener('visibilitychange',welcomeVisibility);overlay.querySelector('button').focus({preventScroll:true});welcomeVisibility();
}

function welcomeVisibility(){
 const overlay=document.querySelector('#zami-welcome');if(!overlay)return;
 clearTimeout(welcomeTimer);overlay.classList.toggle('paused',document.hidden);
 if(!document.hidden)requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!document.hidden&&document.querySelector('#zami-welcome'))welcomeTimer=setTimeout(finishWelcome,2400)}));
}
window.startZamifyWelcome=()=>{if(document.hidden)return;showWelcome();};
render();
if(typeof location!=='undefined'&&location.hash==='#android'){
 if(window.zamifyNativeVisible)window.startZamifyWelcome();
 document.addEventListener('visibilitychange',()=>{if(window.zamifyNativeVisible)window.startZamifyWelcome()});
}else if(typeof window.addEventListener==='function'){
 if(document.readyState==='complete')window.startZamifyWelcome();
 else window.addEventListener('load',window.startZamifyWelcome,{once:true});
 document.addEventListener('visibilitychange',window.startZamifyWelcome);
}
</script></body></html>
