plugins { id 'com.android.application' }
android {
    namespace 'com.zamify.study'
    compileSdk 36
    defaultConfig {
        applicationId 'com.zamify.study'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.8.0'
    }
    sourceSets {
        main.assets.srcDirs = []
        debug.assets.srcDirs = ['src/main/assets']
        release.assets.srcDirs = [layout.buildDirectory.dir('generated/freeReleaseAssets')]
    }
}

tasks.register('prepareFreeReleaseAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'prepare_release.py'
    inputs.files(rootProject.file('Preview.html'), rootProject.file('questions.json'))
    outputs.file(layout.buildDirectory.file('generated/freeReleaseAssets/index.html'))
}
tasks.configureEach {
    if (name == 'mergeReleaseAssets') {
        dependsOn tasks.named('prepareFreeReleaseAssets')
    }
}
