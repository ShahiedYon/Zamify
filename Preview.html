 "The measurement must match the stated pricing unit."}], "hint": "Use the provider’s stated billing unit rather than a convenient text-length estimate.", "analysis": "The scenario specifies input-token pricing. Compare tokenized inputs using the same model and price; total inference cost can also include output tokens.", "trap": "Treating one word as exactly one token, or confusing input cost with the total bill.", "reasons": ["Both prompts are single requests; request count does not explain different input-token charges.", "A word may be represented by one or several tokens, so equal word counts can have different costs.", "The tokenizer determines the model’s input units, which are used for the stated pricing model.", "Character counts can be a rough proxy but are not the billing unit in this scenario."], "kind": "single", "reviewedOn": "2026-10-30", "objective": "2.1", "concept": "Tokens and input cost", "difficulty": "Foundation", "transfer": "Changing languages or including code can change token counts even when the request means the same thing.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "keyPoints": ["priced per input token", "word counts are equal"]}, {"id": 7, "domain": 2, "q": "A search app needs to find passages that mean something similar to a user’s query even when they use different words. What representation should it compare?", "options": ["Encrypted copies of the query and passages", "Numeric embedding vectors of the query and passages", "The number of tokens billed for each passage", "The model’s claimed confidence in its generated answer"], "answer": 1, "why": "Embedding vectors can be compared to retrieve semantically related content.", "clues": [{"text": "different words", "why": "Exact word matching can miss related meaning."}], "hint": "Look for a representation designed for semantic similarity rather than storage or billing.", "analysis": "Encode both query and passages with a compatible embedding model, then compare vectors; verify permissions and relevance before generating an answer.", "trap": "Treating a vector as encryption or a guarantee that a retrieved passage is correct.", "reasons": ["Encryption protects data but does not provide semantic similarity values.", "Embeddings represent features numerically for vector similarity search.", "Token counts measure input length, not meaning.", "A generated confidence claim is not a passage representation."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Embeddings for semantic search", "transfer": "“How do I cancel?” may retrieve a passage headed “termination procedure” through semantic vector similarity.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["different words"]}, {"id": 8, "domain": 2, "q": "A chatbot invents a believable citation. What is this called?", "options": ["Data poisoning", "Prompt injection", "Hallucination", "Model distillation"], "answer": 2, "why": "Fabricating a plausible citation is an example of hallucination: generated content without factual support.", "clues": [{"text": "invents a believable citation", "why": "The output sounds credible but lacks factual support."}], "hint": "Distinguish fluent wording from verified evidence.", "analysis": "The failure is fabricated factual content. Neither a confident tone nor a citation-shaped string proves truth.", "trap": "Do not treat a plausible citation as a checked source.", "reasons": ["Data poisoning corrupts training or source data; the scenario describes an unsupported generated assertion.", "Prompt injection involves instructions trying to redirect the system; no such attack is described.", "Fabricating a plausible citation is an example of hallucination: generated content without factual support.", "Distillation trains a smaller model from a teacher and is not the name for fabricated content."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Hallucination", "transfer": "A generated legal reference should be verified against the actual source before use.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 9, "domain": 2, "q": "A product team wants managed API access to foundation models from several providers and will select a model at request time. Which AWS service is the primary model-access layer?", "options": ["Amazon Bedrock Knowledge Bases", "Amazon SageMaker JumpStart", "Amazon Bedrock AgentCore Runtime", "Amazon Bedrock"], "answer": 3, "why": "Amazon Bedrock supplies the managed foundation-model access requested.", "clues": [{"text": "managed API access to foundation models from several providers", "why": "The requirement is model invocation, not retrieval or agent hosting."}], "hint": "Distinguish the model access layer from tools that can surround it.", "analysis": "Bedrock can be combined with Knowledge Bases for retrieval or AgentCore for operating agents; those are additional roles.", "trap": "Choosing a related Bedrock capability simply because it also appears in an AI application.", "reasons": ["Knowledge Bases adds retrieval for applications; it is not the general multi-provider model API.", "JumpStart helps discover and deploy pretrained models, but the scenario asks for the managed model API layer.", "AgentCore Runtime runs agents and tools, not the primary model catalogue/inference service.", "Bedrock provides managed access to foundation models from multiple providers."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Bedrock model access versus adjacent services", "transfer": "A team may compare provider models through Bedrock before adding a document knowledge base.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["managed API access to foundation models from several providers"]}, {"id": 10, "domain": 2, "kind": "match", "q": "An internal assistant must connect to tools, respect access limits, use changing policies and adopt a response style. Match each requirement to the most direct concept. Use each option once.", "options": ["IAM authorization", "Fine-tuning", "Model Context Protocol (MCP)", "Retrieval-Augmented Generation (RAG)"], "answer": [2, 0, 3, 1], "reasons": ["IAM policies control permitted actions on AWS resources; a tool connection does not grant those permissions.", "Fine-tuning adapts weights using training examples; it is different from inserting documents into a prompt.", "MCP standardizes connections to external tools and context; authorization is still needed.", "RAG retrieves relevant source material for the current request without retraining the foundation model."], "why": "MCP connects tools, IAM authorizes access, RAG supplies retrieved context and fine-tuning adapts model weights. These capabilities can complement one another.", "clues": [{"text": "most direct concept", "why": "Match each responsibility rather than choosing an entire architecture."}], "hint": "Distinguish connection, permission, runtime information and training.", "analysis": "Match the verb in each requirement to the capability. An application may use all four, but each requirement asks for one primary role.", "trap": "Assuming that connecting a tool authorizes it, or that retrieving a document trains the model.", "prompts": ["Standardize discovery and calls to supported external tools", "Decide which AWS resources its identity may access", "Supply current policy passages at request time", "Adapt model weights using approved response examples"], "reviewedOn": "2026-10-30", "objective": "2.1", "relatedObjectives": ["3.1", "3.3", "5.1"], "concept": "Connection, authorization, retrieval and training", "difficulty": "Applied", "transfer": "A connected expense tool still needs access checks; retrieving its latest policy does not change the model’s weights.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "keyPoints": ["most direct concept", "Use each option once"]}, {"id": 11, "domain": 3, "q": "An employee assistant must answer from a large policy library that changes daily and show supporting passages. The team will keep its existing foundation model. Which design best meets both requirements?", "options": ["Retrieve relevant passages from a synchronized policy index and attach source references", "Fine-tune weekly on the policies and ask the model to name its sources", "Cache generated policy answers and refresh them after users report changes", "Add a link to the policy website in the system prompt without retrieving its content"], "answer": 0, "why": "RAG can supply current, relevant policy passages and their source references at answer time. The source-to-index synchronization must also stay current.", "clues": [{"text": "changes daily", "why": "The information pipeline must reflect updates."}, {"text": "supporting passages", "why": "The answer needs retrieved evidence, not just a source name."}], "hint": "Check how each approach obtains updated evidence and makes it traceable.", "analysis": "Both daily changes and supporting passages matter. Choose current retrieval with source metadata, then check that answers are supported by the retrieved text.", "trap": "Assuming that a generated citation or a current-looking URL proves the answer is grounded.", "reasons": ["Retrieval from an updated index supplies both current evidence and traceable passages.", "Weekly training can lag daily changes, and naming a source is not evidence that its passage was retrieved.", "Cached answers can remain stale until a user notices; they do not meet the requirement for current supporting passages.", "A URL alone does not give the model access to the page or retrieve supporting text."], "kind": "single", "reviewedOn": "2026-10-30", "objective": "3.1", "concept": "RAG for current, traceable knowledge", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/rag-vs-fine-tuning.html", "transfer": "For a changing product catalogue, refresh retrieval data and check grounding; retraining alone does not supply current source passages.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "keyPoints": ["changes daily", "supporting passages", "existing foundation model"]}, {"id": 12, "domain": 3, "q": "A prompt includes three examples of the desired response. Which technique is used?", "options": ["Zero-shot", "Distillation", "Few-shot", "Pre-training"], "answer": 2, "why": "Few-shot prompting supplies examples in context. It does not update model weights.", "clues": [{"text": "three examples", "why": "The prompt demonstrates the desired behavior."}], "hint": "Count examples in the prompt, not model parameters.", "analysis": "Three demonstrations supplied in the prompt make this few-shot prompting. The model is not being trained on a new dataset.", "trap": "Examples in a prompt are not automatically fine-tuning.", "reasons": ["Zero-shot prompting does not supply task demonstrations.", "Distillation trains a student to learn from a teacher model.", "Few-shot prompting uses a small number of examples in context.", "Pre-training learns model parameters from a broad training corpus."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Few-shot prompting", "transfer": "Two example replies in a request can demonstrate the desired style without training.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 13, "domain": 3, "q": "Repeated runs of the same summarization prompt produce too much variation. The model exposes temperature and a maximum-output-token setting. The team wants less sampling randomness while retaining room for a complete summary. Which change best fits?", "options": ["Lower temperature while keeping the output-token budget unchanged", "Lower the output-token budget while keeping temperature unchanged", "Add stop sequences while keeping temperature unchanged", "Cache the first summary and reuse it for every later document"], "answer": 0, "why": "Lower temperature generally favors higher-probability next tokens, reducing sampling variation without directly shortening the output allowance.", "clues": [{"text": "less sampling randomness", "why": "The requested behavior is controlled by a sampling parameter."}], "hint": "Distinguish a sampling control from a length control or response reuse.", "analysis": "The requested change concerns variability, with output space preserved. Evaluate lower temperature on representative summaries and check factual accuracy separately.", "trap": "Assuming less randomness guarantees truth, or reducing length when the problem is variability.", "reasons": ["This adjusts sampling randomness while preserving room for the summary; it does not guarantee identical or factual responses.", "The token budget limits length and may truncate a summary, rather than directly controlling sampling randomness.", "Stop sequences terminate generation at specified text; they do not directly adjust the sampling distribution.", "Reusing one answer for different documents can return the wrong summary and does not tune generation."], "kind": "single", "reviewedOn": "2026-10-30", "objective": "3.1", "concept": "Temperature versus output length", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html", "transfer": "For repeated extraction tasks, lower temperature may improve consistency, but schema validation and factual checks remain necessary.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "keyPoints": ["less sampling randomness", "retaining room for a complete summary"]}, {"id": 14, "domain": 3, "q": "A team wants a smaller model to learn from a larger model’s outputs. What is this?", "options": ["Few-shot prompting", "Retrieval-augmented generation", "Prompt caching", "Model distillation"], "answer": 3, "why": "Distillation trains a smaller student to learn from a larger teacher model.", "clues": [{"text": "smaller model", "why": "A smaller student is learning from a larger teacher."}], "hint": "Distinguish training a student from retrieving documents.", "analysis": "The goal is transferring capabilities from a larger model to a smaller one. That is a model-training relationship rather than context retrieval.", "trap": "Do not confuse distillation with compressing a prompt.", "reasons": ["Few-shot prompting supplies examples at inference time without training a student model.", "RAG retrieves source material for context and does not itself train a student.", "Prompt caching reuses supported processing of repeated context rather than transferring model capabilities.", "Distillation trains a smaller student to learn from a larger teacher model."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Model distillation", "transfer": "A smaller student model can be trained using responses from a larger teacher.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 15, "domain": 3, "q": "A support agent answers questions fluently but customers still abandon cases when the agent cannot complete a required handoff. Which evaluation best measures whether the application meets the business goal?", "options": ["Measure completed cases, successful handoffs, user satisfaction and cost on representative cases", "Measure response helpfulness alone on a generic benchmark", "Measure the agent’s retrieval accuracy without checking the handoff", "Measure the foundation model’s raw token speed without task outcomes"], "answer": 0, "why": "Evaluate the full workflow against business outcomes and cost, not only a component’s output quality.", "clues": [{"text": "cannot complete a required handoff", "why": "The failure occurs after a plausible answer, at the workflow boundary."}], "hint": "Identify what a successful case requires beyond a good response.", "analysis": "Evaluate representative end-to-end tasks, including action outcomes and user experience. Component metrics help diagnose failures after the business result is measured.", "trap": "Treating a fluent response or good retrieval result as completed customer work.", "reasons": ["End-to-end cases and handoffs, with quality and cost, reflect the actual objective.", "Helpfulness on unrelated prompts can miss failure in the business workflow.", "Retrieval quality matters, but a correct document does not prove the handoff completes.", "Tokens per second can affect latency but cannot establish task completion."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.4", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A travel agent is useful when the booking completes correctly, not merely when its itinerary sounds helpful.", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "concept": "End-to-end agent evaluation", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["cannot complete a required handoff"]}, {"id": 16, "domain": 4, "q": "A hiring model has high overall accuracy. One demographic group reports more mistaken rejections, but few members of that group appear in the evaluation data. What is the best first investigation?", "options": ["Compare average model confidence across all applicants", "Compare subgroup false-rejection rates and whether each sample supports a reliable conclusion", "Remove demographic labels from the evaluation data and repeat the aggregate score", "Apply the same decision threshold to every group and report the original accuracy"], "answer": 1, "why": "Subgroup error rates investigate the reported harm, while sample adequacy determines how confidently those rates can be compared.", "clues": [{"text": "mistaken rejections", "why": "Investigate the relevant error, not confidence alone."}, {"text": "few members", "why": "A small sample can make comparisons unreliable."}], "hint": "Measure the reported harm for the affected group, then check the strength of the evidence.", "analysis": "A high average does not answer a subgroup question. Investigate error rates and representation before selecting a mitigation; handle demographic data with suitable privacy controls.", "trap": "Treating equal thresholds, confidence or aggregate accuracy as proof of fairness.", "reasons": ["Overall confidence can conceal subgroup errors and is not a measure of the reported false rejections.", "This directly investigates the reported error and the strength of the supporting evidence.", "Removing labels prevents the proposed subgroup comparison; it does not establish fairness.", "A common threshold alone does not establish comparable error rates or fix an inadequate evaluation sample."], "kind": "single", "reviewedOn": "2026-10-30", "objective": "4.1", "concept": "Fairness and subgroup evaluation", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp02.html", "transfer": "A service can score well overall while working poorly for a language or region with little evaluation data.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "keyPoints": ["mistaken rejections", "few members", "first investigation"]}, {"id": 17, "domain": 4, "q": "A loan model declines an application. A reviewer needs to explain which factors influenced this specific result without promising that the model is always right. Which capability helps most?", "options": ["A model card describing intended use for the model as a whole", "A case-level explanation of influential inputs, checked for its limits", "A CloudTrail record of who invoked an API", "A precision score aggregated across all applicants"], "answer": 1, "why": "Case-level explainability helps interpret influential factors in an individual prediction; it does not prove the decision is correct or fair.", "clues": [{"text": "this specific result", "why": "The reviewer needs reasons relevant to one outcome."}], "hint": "Distinguish a local explanation from a model-wide record or performance metric.", "analysis": "Use a suitable explanation method, check its faithfulness and provide a correction path where a person is affected.", "trap": "Treating aggregate performance or general model documentation as an explanation for a specific decision.", "reasons": ["A model card helps document overall use and limitations, but not necessarily this case’s factors.", "A case-level explanation can help interpret this outcome while still requiring validation.", "An API event log shows activity, not why the prediction was made.", "An aggregate metric does not explain the individual result."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "4.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Case-level explainability", "transfer": "A denied claim can show which submitted facts influenced the recommendation while preserving a human appeal.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "contentRevision": 2, "keyPoints": ["this specific result"]}, {"id": 18, "domain": 4, "q": "Which feature helps filter harmful content in a Bedrock application?", "options": ["Amazon Bedrock Guardrails", "AWS Identity and Access Management", "AWS CloudTrail", "Amazon Macie"], "answer": 0, "why": "Bedrock Guardrails provides configurable content safeguards, which should be evaluated alongside other controls.", "clues": [{"text": "filter harmful content", "why": "The required capability is a generation safeguard."}], "hint": "Choose a control that acts on model input or output.", "analysis": "Match a content-safety requirement to a configurable safeguard. Keep other controls and evaluation because filtering is imperfect.", "trap": "Guardrails reduce risk; they are not an absolute safety guarantee.", "reasons": ["Bedrock Guardrails provides configurable content safeguards, which should be evaluated alongside other controls.", "IAM controls authorization; it does not itself classify and filter generated harmful text.", "CloudTrail supports auditing account activity rather than directly filtering a response.", "Macie discovers sensitive data in S3; it is not the Bedrock response content-filter feature."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "4.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Content safeguards", "transfer": "A Bedrock application can evaluate both a user prompt and model response with Guardrails.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-how.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 19, "domain": 4, "q": "A marketing team plans to sell posters made with a generative image service. The source images and model terms have not been checked. What should the team do before commercial use?", "options": ["Check whether the output looks original to a colleague", "Assume generated images have no third-party rights because a model created them", "Use the output if a content filter did not block it", "Review input rights, service terms and intellectual-property risks for the intended use"], "answer": 3, "why": "Commercial use calls for a rights and risk review of the inputs, service terms and output before publication.", "clues": [{"text": "source images and model terms have not been checked", "why": "The unresolved issue concerns permission and terms for the intended use."}], "hint": "Find the action that addresses rights rather than visual quality or safety filtering.", "analysis": "Assess the source material, the model service terms and the intended publication. Seek qualified review where the stakes require it.", "trap": "Treating a content filter or originality impression as proof of commercial rights.", "reasons": ["Appearance alone does not establish legal permission or ownership.", "Generated content can still raise rights and contractual questions.", "A safety filter is not an intellectual-property clearance process.", "Input provenance, applicable terms and intended commercial use determine what needs review."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "4.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A team using generated product packaging should review the rights to uploaded reference art and the service terms.", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "concept": "GenAI intellectual-property risk", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["source images and model terms have not been checked"]}, {"id": 20, "domain": 4, "q": "An AI system recommends whether to deny a high-impact benefit claim. Staff often accept its recommendation without checking source evidence. What design most directly improves responsible oversight?", "options": ["Show a confidence number and automatically finalize high-confidence denials", "Log recommendations for later audit but give staff no way to override them", "Give reviewers the relevant evidence, authority to correct errors and a recorded review route", "Use a larger model and remove staff review to reduce delays"], "answer": 2, "why": "Human oversight needs useful evidence and a real path to intervene, not a nominal reviewer.", "clues": [{"text": "without checking source evidence", "why": "The human role currently lacks meaningful scrutiny."}], "hint": "Find the control that lets a person detect and change a wrong decision before harm.", "analysis": "Place human review where impact is high, present the right information and record the outcome. Test whether staff can actually correct mistakes.", "trap": "Calling a process “human in the loop” when the person cannot evaluate or override it.", "reasons": ["Confidence is not a substitute for evidence or a meaningful human decision.", "After-the-fact logs do not let reviewers prevent or correct a current error.", "Usable evidence and correction authority make oversight operational.", "A larger model can still make consequential mistakes."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "4.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Meaningful human oversight", "transfer": "A claims reviewer should see the cited policy and disputed facts before finalizing a denial.", "source": "https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raiuc04-bp02.html", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["without checking source evidence"]}, {"id": 21, "domain": 5, "q": "An AI application should access only its required S3 objects. Apply which principle?", "options": ["Make the bucket publicly readable for easier access", "Use least-privilege IAM permissions", "Encrypt the bucket but grant broad read permissions", "Give the application a shared administrator credential"], "answer": 1, "why": "Least privilege restricts permitted actions and resources to those required for the application.", "clues": [{"text": "only its required S3 objects", "why": "Scope access to the actual task."}], "hint": "Look for the smallest sufficient permission boundary.", "analysis": "The application needs specific objects, so permissions should be limited to those resources and necessary actions.", "trap": "An application needing access does not justify broad account permissions.", "reasons": ["Public access exceeds the application’s need and may expose objects to others.", "Least privilege restricts permitted actions and resources to those required for the application.", "Encryption protects data but does not justify giving an application excess authorization.", "Administrator credentials exceed the required scope and weaken accountability when shared."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Least privilege", "transfer": "A document assistant should have read access only to the necessary S3 prefix.", "source": "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html", "difficulty": "Applied", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 22, "domain": 5, "q": "Which AWS service records account API activity for auditing?", "options": ["Amazon CloudWatch metrics only", "AWS Config configuration history", "AWS CloudTrail", "AWS Artifact compliance reports"], "answer": 2, "why": "CloudTrail records supported account API events and related activity for audit and investigation.", "clues": [{"text": "API activity", "why": "The requirement is an audit trail of account actions."}], "hint": "Distinguish API auditing from model inference and text services.", "analysis": "The investigator needs records of supported account API events. Select the auditing service rather than language-processing capabilities.", "trap": "Logs serve different purposes; account activity is distinct from text generation.", "reasons": ["Operational metrics are not a substitute for an account API activity audit trail.", "Config tracks resource configuration; it does not replace the requested API event history.", "CloudTrail records supported account API events and related activity for audit and investigation.", "Artifact provides compliance documents rather than recording your account’s API calls."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "API activity audit", "transfer": "A team can inspect CloudTrail events when investigating a changed AWS resource.", "source": "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 23, "domain": 5, "q": "Which service helps discover sensitive data in Amazon S3?", "options": ["Amazon Macie", "AWS Key Management Service", "AWS CloudTrail", "AWS Identity and Access Management"], "answer": 0, "why": "Macie helps discover sensitive data in S3 objects.", "clues": [{"text": "sensitive data in Amazon S3", "why": "The goal is identifying sensitive content in stored objects."}], "hint": "Separate discovery of sensitive data from encryption of that data.", "analysis": "The combination of data discovery and S3 points to a purpose-built sensitive-data service. Discovery does not itself solve every protection requirement.", "trap": "Finding sensitive data is different from controlling who may read it.", "reasons": ["Macie helps discover sensitive data in S3 objects.", "KMS manages cryptographic keys; it does not perform the requested sensitive-content discovery.", "CloudTrail records account activity, not a content classification scan of S3 objects.", "IAM controls access permissions rather than discovering sensitive content."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Sensitive-data discovery", "transfer": "Macie can help find sensitive records in S3 objects before they feed a model.", "source": "https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 24, "domain": 5, "q": "A retrieved document tells an agent to reveal secrets. What is the main threat?", "options": ["An ordinary factual hallucination", "A training underfitting problem", "An output-length limit", "Prompt injection"], "answer": 3, "why": "Prompt injection attempts to redirect an AI system through untrusted instructions, such as retrieved text.", "clues": [{"text": "retrieved document ues": [{"text": "three systems with filtering and corrections", "why": "Several transformation steps need traceability."}], "hint": "Choose a record that can trace the final training row back through its source and processing steps.", "analysis": "Link source, transformations and dataset version. This helps investigate quality, permissions and later model behavior.", "trap": "Mistaking a final file name or performance score for data provenance.", "reasons": ["Accuracy does not describe the data’s origins or changes.", "Lineage links origin and transformations to the final dataset for traceability.", "A filename lacks the upstream sources and processing history.", "Inference latency is operational evidence, not training-data provenance."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Training-data lineage", "transfer": "A merged sales dataset should retain the source system and normalization history of each field.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/datazone-data-lineage.html", "contentRevision": 2, "keyPoints": ["three systems with filtering and corrections"]}, {"id": 26, "domain": 1, "q": "A retailer groups customers by similar purchasing behavior without predefined segment labels. Which technique fits?", "options": ["Regression", "Clustering", "Binary classification", "Speech recognition"], "answer": 1, "why": "Clustering discovers groups based on similarity without predefined target labels.", "reasons": ["Regression predicts a numeric target, not unlabeled groups.", "Clustering discovers groups based on similarity without predefined target labels.", "Binary classification needs a defined two-class target rather than unknown segments.", "Speech recognition transcribes audio and is unrelated to this grouping task."], "clues": [{"text": "without predefined segment labels", "why": "The groups are not known targets."}], "hint": "Decide whether labels are given or groups must be discovered.", "analysis": "The desired output is customer groups, and no labels exist. This combines a grouping goal with unsupervised learning.", "trap": "Unlabeled does not automatically mean clustering; the grouping objective is also essential.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Clustering", "transfer": "Group stores with similar sales patterns without supplying target group labels.", "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-unsupervised.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 27, "domain": 1, "q": "A spam filter raises false alarms on legitimate emails. Which metric directly asks how many predicted spam emails really are spam?", "options": ["Recall", "Accuracy", "Precision", "Mean absolute error"], "answer": 2, "why": "Precision measures actual positives among predicted positives, matching alert reliability.", "reasons": ["Recall asks how many actual spam messages were found, not whether spam alerts are trustworthy.", "Accuracy mixes correct spam and safe predictions and may hide the relevant error.", "Precision measures actual positives among predicted positives, matching alert reliability.", "Mean absolute error measures numeric prediction error, not class-alert reliability."], "clues": [{"text": "predicted spam", "why": "The denominator is the set of positive predictions."}], "hint": "Write out which group appears after the phrase out of.", "analysis": " raining accuracy alone can worsen the actual problem.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Overfitting", "transfer": "A model that memorizes training examples can falter on suitable new cases.", "difficulty": "Foundation", "source": "https://docs.aws.amazon.com/machine-learning/latest/dg/model-fit-underfitting-vs-overfitting.html", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 29, "domain": 1, "kind": "order", "q": "A team has defined a churn-prediction goal and collected historical records. Order the remaining stages so the final test data does not influence model selection. Use each stage once.", "options": ["Train candidates and select settings using the training and validation sets", "Deploy the accepted model and monitor real-world outcomes", "Prepare suitable training, validation and untouched test sets", "Evaluate the selected model on the untouched test set against acceptance criteria"], "answer": [2, 0, 3, 1], "reasons": ["Training fits candidates; validation supports model selection without using final test results.", "Deployment follows an acceptable evaluation, and monitoring checks real-world behavior.", "Establish the splits before fitting; learn preprocessing parameters from training data and apply them to held-out data.", "Use the untouched test set for final assessment after model selection, rather than repeatedly tuning to its results."], "why": "Separate the data first, train and select using development data, evaluate on the untouched test set, then deploy only if acceptance criteria are met.", "clues": [{"text": "final test data does not influence model selection", "why": "Keep the test set separate from training and validation."}], "hint": "Identify when data must be reserved and which evidence should support the release decision.", "analysis": "The split must precede fitting and model selection. Test results should support a release decision rather than become another tuning signal; monitor after deployment.", "trap": "Selecting settings using the final test set, which makes the reported final assessment overly optimistic.", "reviewedOn": "2026-10-30", "objective": "1.3", "concept": "ML lifecycle and data leakage", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-operations-planning/splits-leakage.html", "transfer": "If you repeatedly change a prompt after reading its test results, reserve a fresh assessment set before claiming general performance.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "keyPoints": ["final test data does not influence model selection", "Use each stage once"]}, {"id": 30, "domain": 1, "q": "A website needs a prediction while a customer is waiting at checkout. Which inference pattern fits best?", "options": ["Nightly batch inference", "Real-time inference", "Offline model training", "Historical data labeling"], "answer": 1, "why": "Real-time inference serves low-latency predictions for interactive requests.", "reasons": ["Nightly batch processing does not return a result during the current checkout.", "Real-time inference serves low-latency predictions for interactive requests.", "Training creates or updates the model; it is not the live prediction step.", "Labeling prepares examples rather than responding to the customer."], "clues": [{"text": "while a customer is waiting", "why": "The result is needed during an interactive transaction."}], "hint": "Identify the required response time before selecting a processing pattern.", "analysis"  ["A foundation model", "A classifier trained only for one fixed label set", "A vector database index", "A deterministic access policy"], "answer": 0, "why": "A foundation model is broadly pretrained and usable across multiple downstream tasks.", "reasons": ["Broad pretraining and adaptability across tasks characterize a foundation model.", "A narrow classifier does not match the described multi-task starting point.", "An index stores representations; it is not the generative or predictive model.", "An access policy enforces permissions rather than learning broad task capability."], "clues": [{"text": "adapted for summarization, question answering and classification", "why": "The same starting model supports distinct tasks."}], "hint": "Ask whether the starting point is a broadly trained model or a task-specific component.", "analysis": "A foundation model may be used directly with prompting or adapted further; suitability still depends on task quality and cost.", "trap": "Confusing a store or a narrow classifier with a multi-purpose pretrained model.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Foundation model versus task-specific component", "transfer": "A single broadly trained model may support both document summaries and question answering through different prompts.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "contentRevision": 2, "keyPoints": ["adapted for summarization, question answering and classification"]}, {"id": 37, "domain": 2, "kind": "order", "q": "Order these stages in a simplified foundation-model lifecycle, including optional adaptation.", "options": ["Evaluate the adapted model against task requirements", "Pre-train the foundation model", "Deploy the model and collect feedback", "Select and curate suitable training data", "Adapt the model if the target task needs it"], "answer": [3, 1, 4, 0, 2], "reasons": ["Evaluate the result of training/adaptation before deployment.", "Pre-training requires selected and prepared data.", "Deployment follows evaluation; feedback can inform later iterations.", "Data selection and curation support the subsequent training stage.", "Task adaptation follows a base model and is not always necessary."], "why": "Curate data → pre-train → adapt if needed → evaluate → deploy and collect feedback.", "clues": [{"text": "including optional adaptation", "why": "Place adaptation after a base model exists and before its final task evaluation."}], "hint": "Trace the dependencies from source data to a deployed model.", "analysis": "The simplified sequence starts with data, produces a base model, optionally adapts it, evaluates suitability, then deploys with feedback.", "trap": "The ordered exercise is a simplified dependency chain; real projects can iterate and evaluate at multiple points.", "reviewedOn": "2026-10-31", "objective": "2.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Foundation-model lifecycle", "transfer": "Evaluate the adapted model before production use and monitor feedback after deployment.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 38, "domain": 2, "q": "An assistant can call an inventory tool, inspect the returned stock level and then decide whether to call a supplier tool to meet a user goal. What behavior distinguishes it from a fixed one-step ffic level", "It reduces the servers and scaling infrastructure the startup operates directly", "It transfers all responsibility for output quality and access permissions to the provider", "It ensures identical latency and model availability in every Region"], "answer": 1, "why": "A managed API can reduce direct infrastructure operations; compare actual cost and latency for the workload.", "reasons": ["Costs depend on traffic and pricing; managed inference is not always cheaper.", "The provider operates much of the inference infrastructure, fitting limited operations capacity.", "The application owner still evaluates output and configures appropriate access.", "Region, capacity and model choice can affect availability and latency."], "clues": [{"text": "little operations capacity and variable traffic", "why": "The team values avoiding server management and scaling work."}], "hint": "Distinguish an operational advantage from guarantees about cost, quality or Region.", "analysis": "Managed and self-hosted inference have different cost and control tradeoffs. Benchmark representative use before scaling.", "trap": "Assuming managed eliminates customer responsibilities or guarantees the lowest bill.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A small support team may start with managed inference, then reassess hosting when sustained high-volume demand changes its economics.", "source": "https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost01-bp01.html", "concept": "Managed API versus self-hosted inference", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["little operations capacity and variable traffic"]}, {"id": 40, "domain": 2, "q": "An assistant has access to a policy index, a conversation history and c workflow addresses the requested development process.", "reasons": ["Prompt Management versions model prompts; it does not create a software feature specification workflow.", "Strands builds agents, not the requested software development environment.", "AgentCore Runtime operates agents rather than turning a feature request into a development plan.", "Kiro supports specification-driven software development with requirements, design and tasks."], "clues": [{"text": "reviewable requirements, design and implementation tasks", "why": "These are software specification artifacts rather than agent runtime components."}], "hint": "Match the requested development workflow, not merely any AI-related AWS tool.", "analysis": "A spec-driven workflow structures what will be built and reviewed; it does not remove the need to test the resulting software.", "trap": "Assuming an agent hosting service is also an IDE or spec planning tool.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A team can use Kiro to plan a billing feature, then review the generated design and test its implementation.", "source": "https://kiro.dev/docs/web/setup/", "concept": "Specification-driven development", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["reviewable requirements, design and implementation tasks"]}, {"id": 44, "domain": 2, "q": "Two models pass a quality threshold on a representative support workload. The smaller model is cheaper but slower for the longest requests; the larger one is faster but costs more. What should the team do before choosing?", "options": ["Choose the largest model because size is a reliable proxy for suitability", "Compare latency and cost distributions against the actual service targets, then choose the fit", "Choose the chea uirements?", "options": ["Retrieve relevant manual passages for each request", "Fine-tune on pairs of customer questions and approved replies", "Include a few demonstrations of the required format in the prompt", "Continue pre-training on the complete manual", "Cache a successful response and reuse it for similar requests"], "answer": [0, 2], "reasons": ["Retrieval selects relevant passages from the manual within the available context; its index must be kept current.", "Fine-tuning can adapt responses but updates model weights, violating the stated constraint.", "Few-shot demonstrations guide the requested format at inference time without training.", "Continued pre-training changes model weights and does not meet the no-training constraint.", "Reused responses can contain stale or mismatched facts and do not jointly provide current evidence and format demonstrations."], "why": "Retrieval supplies relevant manual evidence at request time, while few-shot examples demonstrate the format. Neither approach changes the model’s weights.", "clues": [{"text": "existing model weights", "why": "Eliminate training-based changes."}, {"text": "changing product manual", "why": "The facts must come from updated request-time context."}], "hint": "One approach must supply relevant facts; the other must demonstrate the format without training.", "analysis": "Check both requirements together. Prompt examples show how to respond, while retrieval supplies what the current answer should be based on.", "trap": "Choosing two methods that address style but do not provide fresh product facts.", "reviewedOn": "2026-10-30", "objective": "3.1", "relatedObjectives": ["3.2"], "concept": "RAG plus few-shot prompting", "difficulty": "Applied", "transfer": "A lease assistant can retrieve the relevant contract section and use a few examples to produce a consistent summary format.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "source": "https://docs.aw
