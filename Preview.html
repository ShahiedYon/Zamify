ation technique", "why": "Distinguish reference overlap, semantic similarity and model-based judgment."}], "hint": "Identify how each metric compares or judges the generated response.", "analysis": "Different techniques capture different aspects of text quality. None of these alone guarantees factual correctness.", "trap": "A good overlap score does not prove truth; a model judge also needs validation.", "prompts": ["Translation comparison using n-gram precision and a brevity penalty", "Reference-summary overlap", "Comparison using contextual token embeddings", "A language model scores answers against a rubric"], "reviewedOn": "2026-10-31", "objective": "3.4", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Evaluation method fit", "transfer": "Use human review for nuanced usefulness, and task-specific metrics where suitable.", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "difficulty": "Applied", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 53, "domain": 3, "q": "A RAG assistant retrieves a relevant policy passage but answers with a claim the passage does not support. Which evaluation approach best locates this failure?", "options": ["Evaluate retrieval relevance and the generated answer’s support from the retrieved passage separately", "Measure only the number of documents in the source bucket", "Measure only the language model’s output tokens per second", "Compare the answer to a reference using ROUGE alone"], "answer": 0, "why": "A RAG evaluation should examine both the retrieved evidence and whether the generated answer is grounded in it.", "reasons": ["Separate retrieval and generation checks reveal that retrieval succeeded while grounding failed.", "Document count does not show whether the answer is supported.", "Throughput does not evaluate the claim or cited evidence.", "Lexical overlap alone can miss an unsupported claim and does not isolate retrieval from generation."], "clues": [{"text": "retrieves a relevant policy passage", "why": "The retrieval step may be correct even if generation misuses it."}], "hint": "Separate what was retrieved from what the assistant asserted.", "analysis": "Evaluate retrieval relevance and answer faithfulness/grounding as distinct stages. A good passage can still support a bad answer.", "trap": "Treating good retrieval or a surface text-overlap score as proof of a supported final answer.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.4", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "RAG retrieval versus answer grounding", "transfer": "A product assistant can retrieve the right warranty page yet invent a longer coverage period; check both retrieval and answer support.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-kb.html", "contentRevision": 3, "keyPoints": ["retrieves a relevant policy passage", "claim the passage does not support"]}, {"id": 54, "domain": 3, "q": "An LLM judge rates a new answer style higher than the old one, but human reviewers repeatedly find unsupported claims in the new answers. What is the strongest next evaluation step?", "options": ["Calibrate the judge and rubric against representative human-reviewed examples, including unsupported claims", "Treat the judge score as ground truth because it is numerical", "Remove the human-reviewed examples from the evaluation set", "Increase the candidate model’s output length until the judge score improves"], "answer": 0, "why": "A judge model is another fallible evaluator; calibrate it against suitable human evidence and a clear rubric.", "reasons": ["Calibration tests whether the judge’s scoring tracks the quality criterion that matters.", "A numeric judge score can still reflect model error or rubric bias.", "Removing contradictory evidence would hide the problem, not resolve it.", "Longer answers can add more unsupported claims and do not validate the judge."], "clues": [{"text": "human reviewers repeatedly find unsupported claims", "why": "The automated score conflicts with a relevant quality signal."}], "hint": "Ask how to check whether the evaluator rewards the right behavior.", "analysis": "Compare judge decisions with human-reviewed examples and refine the criteria; retain separate checks for factual support.", "trap": "Treating the judge’s score as objective truth because the scoring process is automated.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.4", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A summarization judge should be checked against human-reviewed cases with subtle omissions and fabricated details.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html", "concept": "LLM judge calibration", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["human reviewers repeatedly find unsupported claims"]}, {"id": 55, "domain": 3, "q": "A refund agent retrieves the right policy but sometimes invokes the wrong tool and leaves the case unfinished. Which evaluation gives the clearest evidence about the application’s failure?", "options": ["Measure only passage relevance in the retriever", "Measure only the model’s answer similarity to a reference sentence", "Replay representative end-to-end cases and check authorized tool calls and final task outcomes", "Count the number of policy documents indexed"], "answer": 2, "why": "The failure is in tool execution and task completion, so evaluate the whole agent workflow.", "reasons": ["Passage relevance cannot detect a wrong tool call after retrieval.", "Text similarity may look good even when the refund workflow fails.", "End-to-end traces reveal execution correctness and whether the task completes.", "Document count says little about action safety or completion."], "clues": [{"text": "invokes the wrong tool", "why": "The agent’s action path matters beyond the retrieved document."}], "hint": "Trace the request through retrieval, selected action and observed outcome.", "analysis": "Evaluate both whether the correct tool was authorized and invoked and whether the customer task actually finished. Component metrics help diagnose the root cause.", "trap": "Calling retrieval success equivalent to agent success.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.4", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Agent workflow evaluation", "transfer": "A travel agent that finds the right fare still needs a correct, authorized booking outcome.", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["invokes the wrong tool"]}, {"id": 56, "domain": 3, "q": "A team tests a prompt change for an assistant, but it cannot reproduce last week’s response or tell whether a regression came from the prompt or model setting. What should it record?", "options": ["Only the latest prompt text", "Versioned prompt and model settings linked to comparable evaluation results", "Only the total number of generated tokens", "Only the user rating of the newest response"], "answer": 1, "why": "Record prompt versions, relevant settings and evaluations so changes can be compared and reproduced.", "reasons": ["The latest text alone loses the earlier version and configuration.", "Versioned artifacts and comparable results support tracing a regression.", "Token totals do not identify which prompt or model configuration changed.", "One rating does not reconstruct the prior setup or isolate a regression."], "clues": [{"text": "prompt or model setting", "why": "More than one change could explain the regression."}], "hint": "Choose a record that preserves both the artifact and evidence for each run.", "analysis": "A prompt variant may include model or inference configuration; keep a representative evaluation set and results linked to that version.", "trap": "Saving only the latest wording while treating evaluations as detached from their configuration.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Prompt and configuration versioning", "transfer": "A support assistant can compare two prompt variants against the same cases before a rollout.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-management.html", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["prompt or model setting"]}, {"id": 57, "domain": 3, "q": "A chatbot must answer using private company documents and show the supporting source passages. Which Bedrock capability best fits?", "options": ["Amazon Bedrock Knowledge Bases", "Amazon Bedrock Guardrails alone", "AWS Artifact", "Amazon Comprehend"], "answer": 0, "why": "Knowledge Bases supports retrieving connected source material for grounded responses and source references.", "reasons": ["Knowledge Bases supports retrieving connected source material for grounded responses and source references.", "Guardrails provides safeguards but does not itself replace document ingestion and retrieval.", "Artifact provides AWS compliance documents, not a general question-answering store for the company’s private policies.", "Comprehend analyzes text; it is not the Bedrock retrieval-and-grounded-generation capability."], "clues": [{"text": "supporting source passages", "why": "The answer must be grounded in the company’s own documents."}], "hint": "Identify the retrieval-and-grounding requirement before selecting a service.", "analysis": "Use document retrieval and grounding rather than a speech service. Document access controls and source freshness still require attention.", "trap": "Do not confuse AWS compliance reports with a knowledge base over your own business documents.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Bedrock Knowledge Bases", "transfer": "Retrieve private product manuals and return source references with an answer.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 58, "domain": 4, "q": "A team wants one place to document a model’s intended use, limitations and evaluation results. What fits?", "options": ["A CloudTrail event log alone", "A SageMaker Model Card", "An IAM permission policy", "An embedding vector index"], "answer": 1, "why": "A Model Card records key model details, intended use, limitations and evaluation information.", "reasons": ["An activity log does not replace structured documentation of intended use and limitations.", "A Model Card records key model details, intended use, limitations and evaluation information.", "IAM policies define permissions rather than documenting the model’s intended use.", "A vector index supports retrieval rather than serving as a model governance record."], "clues": [{"text": "intended use, limitations", "why": "The goal is transparent model documentation."}], "hint": "Choose the artifact that explains the model to stakeholders.", "analysis": "The question asks for a model-information record. Documentation improves transparency but does not itself prove the model is fair or safe.", "trap": "A model card is evidence of documentation, not a certification of correctness.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "4.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Model cards", "transfer": "Record intended use, limitations and evaluation results for a deployed model.", "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/model-cards.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 59, "domain": 4, "kind": "multi", "q": "A model will serve three regions. One region has very few examples in both training and evaluation data. Before claiming comparable regional performance, which TWO actions most directly address this evidence gap?", "options": ["Evaluate each region with an adequately sized, suitable held-out sample", "Increase the size of the existing majority-region evaluation sample", "Curate appropriately sourced examples for the underrepresented region and reassess after model changes", "Apply the same confidence threshold across regions without collecting additional evidence", "Report a population-weighted average of the existing regional scores"], "answer": [0, 2], "reasons": ["Adequate, suitable regional samples support meaningful comparisons without using training outcomes as proof.", "More examples from the already well-represented region do not fill the missing region’s evidence gap.", "Relevant representative data can address the coverage gap; separate evaluation must test the resulting model.", "A shared threshold does not supply missing data or establish comparable performance.", "A weighted average can hide poor performance in a small region and leaves the evidence gap unresolved."], "why": "Suitable held-out evaluation measures regional outcomes, and representative data addresses the coverage gap. Reassess all regions after changes.", "clues": [{"text": "both training and evaluation data", "why": "The gap affects learning and the evidence used to assess it."}], "hint": "Choose a measurement step and a representation step that address the missing region.", "analysis": "Both training coverage and evaluation evidence are limited. Improve representation where appropriate, keep evaluation independent and check for new disparities after changes.", "trap": "Treating a large total dataset or a strong weighted average as proof of regional performance.", "reviewedOn": "2026-10-30", "objective": "4.1", "concept": "Representative data and reliable evaluation", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp02.html", "transfer": "Adding more English examples does not establish reliable performance for a language missing from the test set.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "keyPoints": ["very few examples", "training and evaluation data", "comparable regional performance", "TWO"]}, {"id": 60, "domain": 4, "q": "A company runs millions of short, routine classification requests. A smaller model meets the measured quality and latency targets; a larger model uses more resources for the same workload. Which next step supports sustainability?", "options": ["Keep the larger model solely because its parameter count is higher", "Pilot the smaller suitable model and measure energy or resource use as well as quality", "Double the output length to make the larger model’s answers more detailed", "Run both models for every request indefinitely without a business need"], "answer": 1, "why": "A fit-for-purpose model and measured resource use can reduce unnecessary computation.", "reasons": ["Parameter count alone does not justify extra computation.", "Measure actual workload resource use while preserving the required quality and latency.", "Longer output can increase resource use and does not address this classification need.", "Unnecessary duplicate inference adds work without a justified outcome."], "clues": [{"text": "smaller model meets the measured quality and latency targets", "why": "The smaller option is a plausible fit; verify its resource effect."}], "hint": "Consider the whole workload rather than assuming a model size alone proves sustainability.", "analysis": "Pilot and monitor quality, latency and resource use. Sustainability is an evidence-based operational choice, not a model-name badge.", "trap": "Claiming environmental benefit from a smaller parameter count without measuring the actual workload.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "4.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A routine ticket classifier can be right-sized while more complex cases are routed for additional review.", "source": "https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/sustainability.html", "concept": "Fit-for-purpose model sustainability", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["smaller model meets the measured quality and latency targets"]}, {"id": 61, "domain": 4, "q": "An AI-assisted benefits decision is disputed by an applicant. Staff can inspect the model output, but the applicant receives only “denied” and has no correction route. What change best supports accountability?", "options": ["Publish the full model weights and remove human review", "Provide understandable case-specific reasons and a way to request human review or correction", "Show a confidence score while keeping the decision final", "Ask the applicant to submit the same request repeatedly until the output changes"], "answer": 1, "why": "A person affected by a consequential decision needs understandable reasons and an effective review path.", "reasons": ["Weights alone do not explain an individual decision or give a remedy.", "Meaningful reasons and a review path let a person challenge a possible mistake.", "Confidence is not a decision justification or appeal mechanism.", "Repeated submissions are not an accountable correction process."], "clues": [{"text": "no correction route", "why": "The issue is not only explanation; the person needs a way to contest error."}], "hint": "Consider what the affected person can understand and do after receiving the decision.", "analysis": "Design a human review workflow with sufficient information to investigate and correct a mistake; protect other applicants’ data in the explanation.", "trap": "Mistaking a technical transparency artifact or confidence score for meaningful recourse.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "4.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "An insurance claimant should be told the relevant grounds and how to request a human reconsideration.", "source": "https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raiuc04-bp02.html", "concept": "Human review and correction", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["no correction route"]}, {"id": 62, "domain": 5, "q": "Which AWS service helps assess resource configurations against defined rules over time?", "options": ["AWS Config", "AWS CloudTrail", "Amazon CloudWatch metrics", "AWS Artifact"], "answer": 0, "why": "Config records resource configurations and evaluates them against rules.", "reasons": ["Config records resource configurations and evaluates them against rules.", "CloudTrail records supported API activity; that differs from evaluating configuration state against a rule.", "Metrics monitor operational quantities rather than replacing resource configuration compliance checks.", "Artifact supplies compliance documents rather than tracking your resource configurations over time."], "clues": [{"text": "resource configurations against defined rules", "why": "The requirement is configuration compliance rather than API event history."}], "hint": "Distinguish resource state from records of who called an API.", "analysis": "The focus is whether configured resources comply with rules. CloudTrail would address account API activity, a related but different question.", "trap": "Audit and compliance tools overlap in purpose but capture different evidence.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "AWS Config", "transfer": "Check whether a resource configuration still meets a defined rule after a change.", "source": "https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 63, "domain": 5, "q": "A compliance reviewer needs AWS-provided SOC and ISO reports for a vendor assessment. The team also has its own application logs, but those are not the requested reports. Where should it obtain the AWS documents?", "options": ["AWS CloudTrail", "AWS Config", "AWS Artifact", "Amazon Macie"], "answer": 2, "why": "AWS Artifact supplies AWS compliance documents; customer logs and configuration evidence answer different questions.", "reasons": ["CloudTrail records supported account activity; it is not the report portal.", "Config evaluates customer resource configuration against rules.", "Artifact provides access to AWS compliance reports and agreements.", "Macie finds sensitive data in S3, not AWS auditor reports."], "clues": [{"text": "AWS-provided SOC and ISO reports", "why": "The requested artifacts are AWS’s compliance documents."}], "hint": "Separate provider compliance reports from evidence about your own resource behavior.", "analysis": "Obtain AWS reports from Artifact, then assess separately whether the application’s own controls meet the organization’s requirements.", "trap": "Assuming a provider report proves the customer application itself is compliant.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "AWS compliance documents versus customer evidence", "transfer": "A procurement review may request AWS SOC reports while also checking the customer’s own access logs.", "source": "https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["AWS-provided SOC and ISO reports"]}, {"id": 64, "domain": 5, "q": "A team uses a managed AWS AI service to process customer records. AWS operates the underlying infrastructure. Who must still decide and enforce which employees may send those records to the service?", "options": ["AWS alone, because the infrastructure is managed", "The customer, through its data-handling rules and appropriately scoped access controls", "The foundation model, based on its confidence in each employee", "The external browser used to view the application"], "answer": 1, "why": "Managed service use retains customer responsibility for data and access choices; exact duties depend on the service.", "reasons": ["Managed infrastructure does not transfer every customer data and identity decision to AWS.", "The customer retains decisions about permitted data use and who can access its resources.", "Model confidence is not an authorization control.", "A browser does not define the organization’s AWS permissions."], "clues": [{"text": "which employees may send those records", "why": "This is an authorization and customer-data governance decision."}], "hint": "Separate infrastructure operation from the customer’s identities, permissions and data policy.", "analysis": "Apply service-specific shared responsibility: AWS secures its infrastructure, while the customer configures appropriate access and data handling for its workload.", "trap": "Assuming managed means all data and access decisions are handled by AWS.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A company using managed document analysis still decides who may upload payroll files.", "source": "https://docs.aws.amazon.com/IAM/latest/UserGuide/security.html", "concept": "Shared responsibility for customer data", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["which employees may send those records"]}, {"id": 65, "domain": 5, "kind": "multi", "q": "An order assistant may read order status but must not issue refunds. Even if an injected instruction makes the model request a refund, which TWO controls independently restrict what can execute?", "options": ["Use a runtime identity whose downstream permissions allow only order lookup", "Put the no-refund rule in the system prompt and inspect its wording during testing", "Authorize each tool call at the execution boundary against an approved read-only action set", "Record refund attempts in an audit log and review them after execution", "Require a high model-confidence score before executing a refund request"], "answer": [0, 2], "reasons": ["The actual credential must lack refund capability; hiding a tool while retaining broad credentials is insufficient.", "Prompt instructions guide behavior but cannot serve as the permission boundary if the model requests a forbidden action.", "The execution layer rejects operations outside the approved read-only set before any side effect occurs.", "Logging helps detection and investigation but does not prevent the prohibited refund.", "A confident unsafe request is still unsafe; a confidence threshold does not authorize an action."], "why": "Least-privilege downstream permissions and execution-time authorization enforce the action boundary even when the model generates an unsafe request.", "clues": [{"text": "restrict what can execute", "why": "The controls must block the action outside the model’s text decision."}], "hint": "Distinguish prevention before a side effect from model guidance and after-the-fact detection.", "analysis": "Trace the request through to the credential and API that would perform it. Both identity permissions and tool authorization must restrict the actual action path.", "trap": "Confusing an instruction, an audit record or model confidence with an enforceable permission.", "reviewedOn": "2026-10-30", "objective": "5.1", "concept": "Least privilege and agent action boundaries", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-permissions.html", "transfer": "A reporting assistant needs read-only access to accounting data even if its prompt says never to edit records.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "keyPoints": ["must not issue refunds", "Even if an injected instruction", "TWO", "restrict what can execute"]}, {"id": 66, "domain": 1, "objective": "1.1", "q": "A team has labeled customer-churn rows in a table and a folder of untagged product photos. Which description of these inputs is accurate?", "options": ["Both sets are labeled, structured data because they are stored digitally", "The rows are labeled, structured data; the photos are unstructured and currently unlabeled", "The photos are structured data because each file has a name", "Neither set can be used in AI until converted to text"], "answer": 1, "why": "The table has a schema and target labels. The photos are image content without target labels in the scenario.", "reasons": ["Digital storage does not make content tabular or supply a target label.", "The rows have fields and churn targets; the images lack supplied class labels.", "File metadata does not make the image pixels a structured table for this task.", "Image models can use photos; converting them to text is not inherently required."], "clues": [{"text": "labeled customer-churn rows", "why": "The rows have known target answers; the photos do not."}], "hint": "Separate data shape from whether the desired target is supplied.", "analysis": "Structure and labeling are different properties. A photo file can have metadata while its visual content remains unstructured for this decision.", "trap": "Assuming a filename labels the image for the intended prediction.", "transfer": "A spreadsheet of tagged support tickets is structured and labeled; a folder of untagged voice notes is unstructured and unlabeled.", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "concept": "Structured versus unstructured and labeled data", "difficulty": "Applied", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["labeled customer-churn rows"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 67, "domain": 1, "objective": "1.3", "q": "A deployed fraud model was evaluated well at launch. Months later, the transaction mix changes and confirmed fraud is missed more often. What should the team do first?", "options": ["Keep the launch score as proof the model still performs well", "Monitor current inputs and outcomes against a baseline, investigate drift, then decide whether to update the model", "Increase the model endpoint size without evaluating predictions", "Retrain automatically on every new transaction without labels or validation"], "answer": 1, "why": "Production monitoring can reveal changed inputs or quality. Investigate the cause before retraining and validate any update.", "reasons": ["A historical evaluation does not describe current behavior after the data changes.", "Monitoring input and outcome changes provides evidence for a corrective decision.", "More compute capacity does not directly fix deteriorating fraud detection.", "Unvalidated retraining on new traffic can amplify error and lacks the confirmed targets needed for evaluation."], "clues": [{"text": "Months later, the transaction mix changes", "why": "A launch evaluation may no longer represent production data."}], "hint": "Look for evidence about current data and outcomes before choosing a remedy.", "analysis": "Compare recent data and confirmed labels with a suitable baseline. Drift is a signal to investigate, not automatic proof that retraining will help.", "trap": "Treating a good launch score as permanent model quality.", "transfer": "A seasonal demand forecast needs renewed monitoring when customer behavior changes after a major promotion.", "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/how-it-works-model-monitor.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "concept": "Production model monitoring", "difficulty": "Applied", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["Months later, the transaction mix changes"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 68, "domain": 2, "objective": "2.1", "q": "An assistant needs to remember a customer’s approved preferences across separate conversations. The team already has a protocol for calling external tools. Which capability addresses the new need most directly?", "options": ["A memory store with controlled retrieval of relevant prior context", "Adding another tool protocol without persisting conversation state", "Increasing the output token limit on each request", "Using a content filter to reject unsafe words"], "answer": 0, "why": "Memory stores and retrieves relevant context across sessions. Tool connectivity alone does not preserve preferences.", "reasons": ["Persistent memory can supply approved prior context on a later request.", "A tool protocol defines connection and calls, but does not itself save the needed customer context.", "Output length does not recall prior sessions.", "Filtering content addresses a different safety requirement."], "clues": [{"text": "across separate conversations", "why": "The information must survive the end of one request or session."}], "hint": "Ask where the approved preference will be stored and how a later request retrieves it.", "analysis": "A model call does not automatically remember earlier sessions. Retain only appropriate context and apply access and retention controls.", "trap": "Confusing a connection protocol with persistent agent memory.", "transfer": "A travel assistant may retrieve a saved accessibility preference after a new session begins.", "source": "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-get-started.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "concept": "Agent memory versus tool connectivity", "difficulty": "Applied", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["across separate conversations"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 69, "domain": 2, "objective": "2.2", "q": "A company wants an AI assistant to draft customer replies, but policy wording must be exact and approved. What is the most suitable design?", "options": ["Let the model invent policy language and rely on its confident tone", "Use the model for a draft grounded in approved policy and validate or review the final wording", "Assume the same prompt always produces identical, policy-compliant wording", "Replace the policy source with a larger model and skip checking responses"], "answer": 1, "why": "Generation can help draft, while approved evidence and validation or review address exact policy requirements.", "reasons": ["Fluency is not evidence of accurate or approved policy language.", "Grounding and a check against the approved source address the stated exactness constraint.", "Generative output is not guaranteed deterministic or compliant just because the prompt is repeated.", "Model size cannot replace checking the policy requirement."], "clues": [{"text": "policy wording must be exact and approved", "why": "A fluent draft is insufficient if it changes required language."}], "hint": "Separate where generation adds value from how an exact requirement is enforced.", "analysis": "Use generated text as a draft, retrieve the current approved source where helpful and check the final output against the policy.", "trap": "Treating a persuasive answer as a verified policy statement.", "transfer": "An insurance response can be drafted by a model but still requires a check against the current approved terms.", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "concept": "GenAI limitations and exact business requirements", "difficulty": "Applied", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["policy wording must be exact and approved"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 70, "domain": 3, "objective": "3.1", "q": "A team stores embeddings for millions of internal passages and needs similarity search to retrieve relevant passages for a RAG app. Which component most directly serves that retrieval step?", "options": ["A vector-capable search store such as Amazon OpenSearch Serverless", "AWS CloudTrail event history without an embedding index", "A Bedrock Guardrail content policy without a passage store", "A prompt template containing the name of every document"], "answer": 0, "why": "A vector-capable store can search embeddings for related passages. The other components do not perform the stated retrieval.", "reasons": ["A vector index can retrieve semantically related passages from the stored embeddings.", "CloudTrail is for activity records, not similarity search over passage embeddings.", "Guardrails evaluate content; they do not replace document storage and retrieval.", "Names in a prompt do not retrieve the documents’ relevant content."], "clues": [{"text": "similarity search", "why": "The retrieval component must compare embedding representations."}], "hint": "Identify which component stores and searches passage vectors.", "analysis": "Retrieval also needs permissions, source freshness and checks that the generated answer is grounded in the returned passages.", "trap": "Confusing the generator or safety layer with the retrieval index.", "transfer": "A product catalogue assistant can search item embeddings before composing an answer from current item records.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "concept": "Vector search for RAG", "difficulty": "Applied", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["similarity search"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 71, "domain": 3, "objective": "3.3", "q": "A team plans to fine-tune a foundation model on internal support examples. Which TWO preparations most directly improve the evidence that the customized model will work for the intended users?", "options": ["Curate representative, permitted examples and check labels for the target task", "Put identical examples in training and final evaluation so scores rise", "Keep suitable validation examples separate from training for evaluation", "Include private customer records without checking their permitted use", "Choose examples only from the easiest customer group"], "answer": [0, 2], "why": "Representative, appropriately governed training data and a separate validation set support useful customization and honest evaluation.", "reasons": ["Quality, representation and permitted use matter for the target task.", "Overlapping evaluation examples leak training material into the quality estimate.", "A separate suitable validation set tests behavior outside the training examples.", "Data governance must be checked before using customer records.", "Easy-only examples can hide failures for the broader population."], "clues": [{"text": "fine-tune a foundation model", "why": "Training examples and independent evaluation evidence are both needed."}], "hint": "Select one data-quality/governance step and one evaluation-design step.", "analysis": "Fine-tuning changes weights; the data should reflect the intended population, while evaluation must avoid leakage from training.", "trap": "Assuming a high score on reused training examples proves generalization.", "transfer": "For a multilingual help desk, include permitted examples from supported languages and hold out suitable cases for validation.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/model-customization-prepare.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "concept": "Fine-tuning data preparation", "difficulty": "Applied", "kind": "multi", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["fine-tune a foundation model"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 72, "domain": 3, "objective": "3.3", "q": "A team has curated examples pairing varied user instructions with approved responses. Prompt examples alone have not produced consistent task behavior, and the team can evaluate a weight update. Which approach best matches this training plan?", "options": ["Store more retrieved documents for RAG without training", "Fine-tune the model on the curated instruction-response examples", "Use prompt caching to reuse earlier input tokens", "Increase temperature to make responses more varied"], "answer": 1, "why": "Supervised fine-tuning can adapt weights from curated instruction-response examples; the result still needs evaluation.", "reasons": ["Retrieval supplies context at request time; it does not train the behavior described.", "Fine-tuning uses task examples to adapt model weights, subject to suitable data and evaluation.", "Prompt caching may reduce repeated input processing but does not adapt weights.", "More sampling variation does not train the desired response pattern."], "clues": [{"text": "evaluate a weight update", "why": "The scenario calls for a training-based change rather than only runtime prompting."}], "hint": "Separate a change to model weights from examples supplied with each request.", "analysis": "Because prompt-only examples have not met the behavior requirement, the team is considering training with approved examples. Evaluate whether fine-tuning improves the target task enough to justify its cost.", "trap": "Assuming retrieval or prompt caching changes model weights.", "transfer": "A support classifier can be tuned on approved input/output examples after prompt-only trials fail its consistency target.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/custom-model-fine-tuning.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "concept": "Instruction-response fine-tuning", "difficulty": "Applied", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["Prompt examples alone", "evaluate a weight update"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 73, "domain": 4, "objective": "4.2", "q": "A credit decision model has strong overall accuracy, but affected applicants need understandable reasons and a way to contest mistakes. What should the team prioritize?", "options": ["Publish all private training records to make the model transparent", "Measure whether the explanations are useful and protect sensitive details while enabling human review", "Provide only a confidence score and treat it as the final decision", "Hide every reason because accuracy is already high"], "answer": 1, "why": "Useful explanations and a review path support affected people; transparency must be balanced with privacy.", "reasons": ["Exposing private training data would create a separate privacy harm.", "Measure explanation usefulness and provide protected, meaningful review.", "Confidence alone does not explain or correct an individual decision.", "Overall accuracy does not answer the applicant’s need for reasons or correction."], "clues": [{"text": "understandable reasons and a way to contest mistakes", "why": "The outcome affects a person who needs an actionable explanation."}], "hint": "Consider both the person’s review needs and the data that must stay protected.", "analysis": "Test what an affected user can understand and challenge; protect personal data while evaluating the model and explanation tradeoffs.", "trap": "Equating a high aggregate score with accountability for individual decisions.", "transfer": "An AI-assisted benefits decision should give understandable grounds and a human correction route without disclosing another applicant’s data.", "source": "https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc04-bp02.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "concept": "Explainability, privacy and human review", "difficulty": "Applied", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["understandable reasons and a way to contest mistakes"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 74, "domain": 5, "objective": "5.1", "q": "A team handles sensitive training files in S3 and calls a managed AI service. Which TWO controls address data protection in transit and at rest most directly?", "options": ["Use TLS for supported connections between components", "Give every user administrator permissions to avoid access errors", "Use appropriate server-side encryption for stored files and manage key access", "Rely on a system prompt that tells the model to keep data secret", "Store the same data in a public bucket to simplify retrieval"], "answer": [0, 2], "why": "TLS protects supported traffic in transit, while at-rest encryption and key controls protect stored data.", "reasons": ["TLS addresses interception of supported network traffic.", "Broad permissions increase exposure rather than protecting the data.", "Encryption at rest and controlled key access address stored-data protection.", "A prompt is not a substitute for storage or transport security.", "Public access conflicts with sensitive-data protection."], "clues": [{"text": "in transit and at rest", "why": "Two separate protection states are named."}], "hint": "Choose one transport control and one storage control.", "analysis": "Also apply least privilege and verify each service’s actual encryption configuration; encryption is not a permission system.", "trap": "Thinking a model instruction can enforce infrastructure security.", "transfer": "A medical-document workflow needs protected transport and encrypted storage plus access policies for the right staff.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/data-encryption.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "concept": "Encryption in transit and at rest", "difficulty": "Applied", "kind": "multi", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["in transit and at rest"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 75, "domain": 5, "objective": "5.2", "q": "A company must keep AI interaction logs for a defined period and keep regulated data in an approved Region. Which governance plan best addresses both requirements?", "options": ["Pick a model with a large context window and leave logging defaults unchanged", "Document the retention rule and approved Region, configure the relevant services, and review evidence regularly", "Ask the model to remember the retention policy without configuring storage", "Keep all logs indefinitely in any Region because longer retention is always safer"], "answer": 1, "why": "Governance needs explicit retention and residency requirements, service configuration and recurring verification.", "reasons": ["Context length does not set log retention or data location.", "The policy, configuration and review process address both stated constraints.", "A prompt cannot enforce the storage lifecycle or Region.", "Unlimited retention and arbitrary residency may violate the stated requirements."], "clues": [{"text": "defined period", "why": "The control must implement a specific lifecycle rather than merely collecting logs."}], "hint": "Identify both where data is kept and how long it remains, then how compliance is checked.", "analysis": "Service choices and configurations must reflect the organization’s actual legal and contractual obligations; document the review cadence.", "trap": "Treating a written policy or a model instruction as an implemented governance control.", "transfer": "A support workflow can set a documented log expiry and verify that its storage stays in an approved jurisdiction.", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "concept": "Retention and data residency governance", "difficulty": "Applied", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["defined period"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 76, "concept": "Long-context latency scaling and middle-context attention dilution", "q": "A legal team feeds an entire 400-page contract into a single prompt to check for missing clauses, but the model overlooks clauses located in the middle pages and experiences 18-second response latency. Which limitation explains this behavior?", "options": ["Catastrophic forgetting of weights during inference", "Long-context processing latency and reduced recall for middle-positioned information ('lost in the middle')", "Insufficient temperature settings preventing token generation", "Vector database index corruption during token decoding"], "answer": 1, "why": "Very long prompts increase input processing latency. Some models also retrieve information less reliably from the middle of long contexts. These are inference limitations, not changes to model weights.", "transfer": "When a scenario stuffs an entire multi-hundred-page document into one prompt and sees high latency plus missed middle facts, recognize long-context attention dilution and latency scaling rather than weight corruption.", "clues": [{"text": "entire 400-page contract into a single prompt", "why": "Large inputs increase processing and context-management demands."}, {"text": "overlooks clauses located in the middle pages", "why": "This suggests reduced recall for information in the middle of a long context."}], "hint": "Consider what happens to both inference speed and attention accuracy when you pack hundreds of pages into a single prompt instead of retrieving relevant chunks.", "analysis": "Even within a supported context window, a long input can increase prefill latency and reduce recall. Standard dense self-attention has quadratic attention computation in sequence length; actual latency depends on architecture and implementation. Page count alone does not establish that the context limit was exceeded.", "trap": "Do not confuse inference-time context limitations with training-time catastrophic forgetting.", "reasons": ["Catastrophic forgetting arises during additional training, not read-only inference.", "Long contexts can increase prefill latency and reduce middle-position recall; dense attention has quadratic attention computation, though implementation and model architecture matter.", "Temperature controls output randomness, not input length or prefill work.", "No vector database was used because the entire document was supplied directly."], "keyPoints": ["Long prompts can increase prefill latency and input token cost.", "Models can show lower recall for details buried in very long prompts.", "Targeted retrieval can narrow context; its quality and document coverage still need evaluation."], "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-design.html", "domain": 2, "task": "2.2", "taskTitle": "2.2 Capabilities & Limits", "objective": "2.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/examguides/ai-practitioner-01.html", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 2, "reviewStatus": "Agent-authored; human editorial review pending", "reviewNote": "Added for task expansion from execution handoff; qualified architecture/performance claims; human SME review pending.", "difficulty": 2}, {"id": 77, "concept": "Model size vs latency, memory footprint, and inference cost", "q": "A logistics firm needs an endpoint running on edge scanners to classify damaged package barcodes in under 150 milliseconds at the lowest possible per-request cost. Why is a compact, task-specific model preferred over a 70-billion-parameter general-purpose foundation model?", "options": ["Larger foundation models cannot process structured or image inputs", "Smaller specialized models require significantly less compute memory and deliver lower inference latency and cost for narrow, repetitive tasks", "70-billion-parameter models only operate in batch mode and cannot serve real-time requests", "Smaller models automatically update their own weights from live internet data"], "answer": 1, "why": "A compact model generally uses less memory and compute. For a narrow edge task, it is a better candidate for tight latency and cost constraints, provided benchmarking confirms acceptable accuracy and performance.", "transfer": "When a narrow classification task has a strict millisecond SLA and tight unit cost budget, choose a compact task-specific model over a massive frontier model.", "clues": [{"text": "under 150 milliseconds at the lowest possible per-request cost", "why": "Strict latency and cost constraints favor a smaller model footprint."}], "hint": "Match the complexity of the task and the latency budget to the size of the model.", "analysis": "Model selection balances accuracy, latency, deployment hardware and cost. Parameter count matters, but does not alone guarantee a 150 ms service level.", "trap": "Bigger models are not always better when latency, edge hardware, and unit economics are constrained.", "reasons": ["Some large foundation models support images or structured inputs.", "Compact models generally reduce memory and compute; validate the latency target on the actual scanner.", "Large models can serve real-time requests but may be unsuitable for this edge deployment.", "Deployed models do not automatically retrain on live internet data."], "keyPoints": ["Parameter count affects memory requirements and inference resources.", "Narrow tasks may not need frontier-scale general reasoning.", "Benchmark accuracy, latency and cost on the target hardware."], "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/model-selection.html", "domain": 2, "task": "2.2", "taskTitle": "2.2 Capabilities & Limits", "objective": "2.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/examguides/ai-practitioner-01.html", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 2, "reviewStatus": "Agent-authored; human editorial review pending", "reviewNote": "Added for task expansion from execution handoff; qualified architecture/performance claims; human SME review pending.", "difficulty": 2}, {"id": 78, "concept": "Probabilistic token generation vs deterministic arithmetic tool use", "q": "An accounting team asks a standalone text foundation model (with no external tools attached) to calculate the exact compound interest and amortization schedule for 450 loans. Why is relying solely on the foundation model's native token generation risky?", "options": ["Foundation models predict probable next tokens rather than executing deterministic arithmetic, which can introduce rounding or calculation errors", "Foundation models reject prompts containing numeric digits", "Tokenizers strip all decimal points before inference", "Foundation models can only output text in natural paragraphs, not tables"], "answer": 0, "why": "Language models generate tokens from learned patterns and do not guarantee exact arithmetic. Delegate financial calculations to tested deterministic code with explicit decimal precision and rounding rules.", "transfer": "When a scenario requires exact multi-step arithmetic or amortization schedules, do not rely on raw token prediction; delegate calculation to deterministic code or tool calls.", "clues": [{"text": "standalone text foundation model (with no external tools attached)", "why": "There is no calculator or code tool to execute the formulas."}, {"text": "exact compound interest and amortization schedule", "why": "Financial results require validated arithmetic and rounding rules."}], "hint": "Ask how an autoregressive language model produces numbers compared to a deterministic calculator or Python script.", "analysis": "A model can help orchestrate a calculation tool, but numerical results need validation. Use decimal arithmetic where financial rounding demands it; floating-point code alone does not ensure financial correctness.", "trap": "Accurate simple examples do not guarantee reliable multi-step amortization.", "reasons": ["Token generation alone does not guarantee exact numerical results.", "Models can accept numeric inputs.", "Tokenization does not universally strip decimal points.", "Models can format tables even when their numerical contents are wrong."], "keyPoints": ["Token generation does not guarantee exact arithmetic.", "Multi-step financial calculations need explicit precision and rounding rules.", "Tool calling can delegate calculations to tested code."], "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/agents.html", "domain": 2, "task": "2.2", "taskTitle": "2.2 Capabilities & Limits", "objective": "2.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/examguides/ai-practitioner-01.html", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 2, "reviewStatus": "Agent-authored; human editorial review pending", "reviewNote": "Added for task expansion from execution handoff; qualified architecture/performance claims; human SME review pending.", "difficulty": 2}, {"id": 79, "concept": "Multimodal vision-and-text foundation model capabilities", "difficulty": 1, "q": "A field maintenance app needs technicians to upload photos of wiring diagrams alongside typed symptom notes so a single model can diagnose faults in one call. Which model capability is required?", "options": ["Text-to-embedding unimodal encoding", "Multimodal input processing (vision + text)", "Whisper speech-to-speech synthesis", "K-means unsupervised clustering"], "answer": 1, "why": "A multimodal foundation model can accept images and text in the same request. Appropriate input support is necessary, but diagnostic accuracy and safety must still be validated.", "transfer": "When a single request combines visual schematics or photos with natural-language notes, select a multimodal foundation model.", "clues": [{"text": "photos of wiring diagrams alongside typed symptom notes", "why": "The request combines visual and textual inputs."}], "hint": "Look at the number and types of input modalities passed in the same request.", "analysis": "A vision-and-text model can use image content and accompanying notes together. Multimodal input support does not guarantee correct spatial interpretation or a safe diagnosis.", "trap": "A text-only embedding model cannot directly inspect image pixels.", "reasons": ["Text-only embeddings encode text rather than raw diagram pixels.", "Vision-and-text multimodal processing supports both requested input types.", "Whisper is a speech recognition model, not a wiring-diagram reasoning capability.", "K-means clusters numeric vectors rather than interpreting the combined request."], "keyPoints": ["Multimodal models can accept more than one input type.", "Choose a model explicitly supporting both image and text inputs.", "Validate diagram interpretation before relying on diagnoses."], "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html", "domain": 2, "task": "2.2", "taskTitle": "2.2 Capabilities & Limits", "objective": "2.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/examguides/ai-practitioner-01.html", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 2, "reviewStatus": "Agent-authored; human editorial review pending", "reviewNote": "Added for task expansion from execution handoff; qualified architecture/performance claims; human SME review pending."}, {"id": 80, "concept": "Continued pre-training on unlabeled domain corpora", "q": "A biotech company wants a foundation model to deeply learn proprietary genomic terminology and internal research literature from 50 GB of unlabeled scientific articles before any task-specific instruction tuning. Which customization technique fits?", "options": ["Continued pre-training (domain-adaptive pre-training) on unlabeled domain corpora", "Supervised instruction fine-tuning with labeled Q&A pairs", "Zero-shot prompt engineering with stop sequences", "Reinforcement Learning from Human Feedback (RLHF)"], "answer": 0, "why": "Continued pre-training further trains an existing foundation model on unlabeled domain text to adapt its language patterns and domain familiarity.", "transfer": "When the training dataset is a large unlabeled corpus of domain articles or jargon rather than labeled Q&A pairs, choose continued pre-training.", "clues": [{"text": "50 GB of unlabeled scientific articles", "why": "A large raw domain corpus points to continued pre-training."}], "hint": "Check whether the dataset consists of labeled instruction-response pairs or raw domain documents.", "analysis": "Continued pre-training uses raw domain text; supervised instruction fine-tuning uses instruction-response examples. Availability and dataset requirements depend on the selected model and service.", "trap": "Do not confuse raw domain adaptation with supervised instruction tuning.", "reasons": ["Continued pre-training adapts an existing model using unlabeled domain text.", "Supervised instruction tuning needs suitable instruction-response examples.", ers."}], "hint": "Select the fine-tuning family that freezes base weights and trains lightweight adapters.", "analysis": "LoRA can reduce optimizer-state memory and checkpoint storage compared with full fine-tuning. The frozen base model still occupies memory; quality and savings require evaluation.", "trap": "Full-parameter fine-tuning requires updating all base weights and their optimizer state.", "reasons": ["LoRA trains small low-rank matrices while keeping base weights frozen.", "A larger full-fine-tuning cluster does not reduce the number of trainable parameters.", "max_tokens controls output length during inference.", "Changing the data file format does not reduce trainable model parameters."], "keyPoints": ["LoRA is one member of the PEFT family.", "Base weights stay frozen while small adapter matrices are trained.", "Savings and final quality vary by model, task and configuration."], "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-lora.html", "domain": 3, "task": "3.3", "taskTitle": "3.3 Training & Fine-Tuning", "objective": "3.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/examguides/ai-practitioner-01.html", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 2, "reviewStatus": "Agent-authored; human editorial review pending", "reviewNote": "Added for task expansion from execution handoff; qualified architecture/performance claims; human SME review pending.", "difficulty": 2}, {"id": 82, "concept": "Teacher-student knowledge distillation", "q": "A company has a high-performing 70B teacher foundation model that is too slow and expensive for high-volume mobile traffic. How can they transfer its task capability into a fast 3B model?", "options": ["Model distillation (knowledge distillation) using teacher-generated completions to train the smaller student model", "Adding more system prompt instructions to the 70B model", "Enabling Multi-AZ deployment on the 70B endpoint", "Replacing the 70B model with an uncalibrated random forest"], "answer": 0, "why": "Knowledge distillation trains a smaller student on outputs from a larger teacher for a target use case. The student can reduce inference resources while retaining useful task performance.", "transfer": "When a large teacher model is accurate but too slow or costly for production scale, use Model Distillation to train a smaller student model.", "clues": [{"text": "transfer its task capability into a fast 3B model", "why": "Teacher-to-student knowledge transfer describes distillation."}], "hint": "Look for the teacher-student training technique supported by Amazon Bedrock Model Distillation.", "analysis": "Amazon Bedrock Model Distillation generates teacher responses and fine-tunes a supported student model. Supported teacher-student pairs are constrained; the example sizes do not promise an available Bedrock pairing.", "trap": "Multi-AZ improves availability without shrinking the model.", "reasons": ["Distillation transfers task behavior through teacher-generated training targets.", "More prompting does not create a compact student model.", "Multi-AZ changes availability rather than parameter count.", "A random forest is not a replacement for a generative language model in this scenario."], "keyPoints": ["A teacher supplies training targets for a smaller student.", "Evaluate the accuracy, latency and cost trade-offs on the target task.", "Bedrock supports distillation for eligible teacher-student combinations."], "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html", "domain": 3, "task": "3.3", "taskTitle": "3.3 Training & Fine-Tuning", "objective": "3.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/examguides/ai-practitioner-01.html", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 2, "reviewStatus": "Agent-authored; human editorial review pending", "reviewNote": "Added for task expansion from execution handoff; qualified architecture/performance claims; human SME review pending.", "difficulty": 2}, {"id": 83, "concept": "Preference alignment via RLHF and Direct Preference Optimization (DPO)", "q": "After supervised instruction fine-tuning, a conversational model follows instructions well, but occasionally generates rude or unhelpful phrasing when users are frustrated. Which post-training alignment method uses ranked pairs of preferred vs. rejected responses to align model tone with human values?", "options": ["Reinforcement Learning from Human Feedback (RLHF) or Direct Preference Optimization (DPO)", "Tokenization byte-pair encoding (BPE)", "Principal Component Analysis (PCA)", "Min-max feature scaling"], "answer": 0, "why": "Preference-based RLHF and DPO use comparisons of preferred and rejected responses to influence model behavior. RLHF commonly learns a reward model; DPO directly optimizes a preference objective.", "transfer": "When a model already follows instructions but needs alignment on helpfulness, safety, or tone using human-ranked preference pairs, choose RLHF or DPO.", "clues": [{"text": "ranked pairs of preferred vs. rejected responses to align model tone", "why": "Preference comparisons are the training signal for these alignment methods."}], "hint": "Identify the alignment stage that optimizes for human preferences after instruction tuning.", "analysis": "Pre-training, instruction tuning and preference alignment serve different purposes. Preference training can improve helpfulness or tone but does not guarantee safety or correctness.", "trap": "Tokenization, dimensionality reduction and feature scaling are not preference alignment.", "reasons": ["Preference-based RLHF and DPO use response comparisons to shape behavior.", "BPE tokenizes text into subword units.", "PCA reduces numeric feature dimensionality.", "Min-max scaling rescales numeric features."], "keyPoints": ["Preference alignment uses chosen and rejected responses.", "RLHF and DPO differ in their optimization procedures.", "Evaluate tone, helpfulness and safety after alignment."], "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-dpo.html", "domain": 3, "task": "3.3", "taskTitle": "3.3 Training & Fine-Tuning", "objective": "3.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/examguides/ai-practitioner-01.html", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 2, "reviewStatus": "Agent-authored; human editorial review pending", "reviewNote": "Added for task expansion from execution handoff; qualified architecture/performance claims; human SME review pending.", "difficulty": 2}], "freeIds": [1, 29, 6, 10, 11, 13, 45, 16, 59, 65], "lessons": [{"title": "Recognize the prediction target", "body": "Regression predicts a numeric amount. Classification predicts a category. Clustering groups similar examples without target labels. Reinforcement learning optimizes actions using rewards. Start with the output and constraints before choosing a service.", "recall": "Forecast a lease payment amount: regression or classification?", "answer": "Regression.", "exercise": "A business asks for the payment amount and a high-risk flag. Separate the outputs.", "solution": "Predict a numeric payment using regression. A risk classification or threshold rule is a separate output; evaluate each against its actual business target."}, {"title": "Understand generative AI", "body": "Foundation models learn general patterns from large datasets. Prompts guide a response; tokens are model processing units. Temperature affects sampling randomness. Evaluate accuracy, safety, cost, and latency with representative use cases.", "recall": "Does reducing temperature guarantee factual answers?", "answer": "No. Lower randomness does not provide missing knowledge or guarantee truth.", "exercise": "A manager proposes judging a chatbot only by how fluent it sounds. Improve the acceptance criteria.", "solution": "Use grounded correctness, unsupported-claim rate, task completion, safety cases, latency and cost. Include representative and adversarial cases and define when human review is required."}, {"title": "Build grounded applications", "body": "Use retrieval-augmented generation (RAG) to bring relevant external evidence into a prompt. Embeddings support similarity search. Fine-tuning changes model behavior through training. Amazon Bedrock offers managed foundation model access; SageMaker AI supports ML development workflows.", "recall": "Does a vector database itself write the final answer?", "answer": "No. It retrieves similar items; a generation model creates the response.", "exercise": "A private document bot gives outdated answers. Describe where to look.", "solution": "Check document access and freshness, ingestion, chunking, retrieval relevance, then the generated answer’s grounding. Maintain source references and evaluate with held-out questions."}, {"title": "Evaluate responsible use", "body": "Inspect data quality, fairness, privacy, transparency and human oversight throughout the lifecycle. Accuracy alone may hide harm to smaller groups. Human review needs a clear decision owner and escalation criteria.", "recall": "Can one high overall accuracy prove fairness?", "answer": "No. Evaluate relevant groups, errors, impacts and the intended context.", "exercise": "A hiring model performs well overall but rejects more qualified candidates from one group. What next?", "solution": "Pause automatic high-impact decisions, inspect group-level errors and data, assess legal and operational requirements with owners, mitigate and retest. Preserve an auditable human review process."}, {"title": "Secure and govern", "body": "Identity and Access Management (IAM) grants scoped permissions. S3 stores objects; CloudWatch monitors operations; CloudTrail records supported API activity. Protect sensitive inputs and outputs, encrypt where required, and keep secrets outside prompts.", "recall": "CloudWatch or CloudTrail for identifying who changed a resource?", "answer": "CloudTrail.", "exercise": "A developer places an administrator API key in a chatbot prompt. Propose a correction.", "solution": "Revoke and rotate the exposed secret, inspect use, move credentials to protected service-side handling, grant least privilege and enforce authorization in the tool execution path."}], "productId": "zamify_aif_c01_full_pack", "practiceMinutes": 90, "officialFormat": "65 questions / 90 minutes; local mini mocks use proportionate time.", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01.html", "reviewedOn": "2026-11-18", "cards": [{"front": "Forecast a lease payment amount: regression or classification?", "back": "Regression."}, {"front": "Does reducing temperature guarantee factual answers?", "back": "No. Lower randomness does not provide missing knowledge or guarantee truth."}, {"front": "Does a vector database itself write the final answer?", "back": "No. It retrieves similar items; a generation model creates the response."}, {"front": "Can one high overall accuracy prove fairness?", "back": "No. Evaluate relevant groups, errors, impacts and the intended context."}, {"front": "CloudWatch or CloudTrail for identifying who changed a resource?", "back": "CloudTrail."}, {"front": "An employee assistant must answer from a large policy library that changes daily and show supporting passages. The team will keep its existing foundation model. Which design best meets both requirements?", "back": "RAG can supply current, relevant policy passages and their source references at answer time. The source-to-index synchronization must also stay current."}, {"front": "A prompt includes three examples of the desired response. Which technique is used?", "back": "Few-shot prompting supplies examples in context. It does not update model weights."}, {"front": "Repeated runs of the same summarization prompt produce too much variation. The model exposes temperature and a maximum-output-token setting. The team wants less sampling randomness while retaining room for a complete summary. Which change best fits?", "back": "Lower temperature generally favors higher-probability next tokens, reducing sampling variation without directly shortening the output allowance."}, {"front": "A team wants a smaller model to learn from a larger model’s outputs. What is this?", "back": "Distillation trains a smaller student to learn from a larger teacher model."}, {"front": "A support agent answers questions fluently but customers still abandon cases when the agent cannot complete a required handoff. Which evaluation best measures whether the application meets the business goal?", "back": "Evaluate the full workflow against business outcomes and cost, not only a component’s output quality."}, {"front": "A hiring model has high overall accuracy. One demographic group reports more mistaken rejections, but few members of that group appear in the evaluation data. What is the best first investigation?", "back": "Subgroup error rates investigate the reported harm, while sample adequacy determines how confidently those rates can be compared."}, {"front": "A loan model declines an application. A reviewer needs to explain which factors influenced this specific result without promising that the model is always right. Which capability helps most?", "back": "Case-level explainability helps interpret influential factors in an individual prediction; it does not prove the decision is correct or fair."}, {"front": "Which feature helps filter harmful content in a Bedrock application?", "back": "Bedrock Guardrails provides configurable content safeguards, which should be evaluated alongside other controls."}, {"front": "A marketing team plans to sell posters made with a generative image service. The source images and model terms have not been checked. What should the team do before commercial use?", "back": "Commercial use calls for a rights and risk review of the inputs, service terms and output before publication."}, {"front": "An AI system recommends whether to deny a high-impact benefit claim. Staff often accept its recommendation without checking source evidence. What design most directly improves responsible oversight?", "back": "Human oversight needs useful evidence and a real path to intervene, not a nominal reviewer."}]}, {"id": "snowpro-core", "title": "SnowPro Core", "code": "COF-C03", "domains": ["Architecture & AI", "Account & governance", "Data loading & unloading", "Performance & recovery", "Collaboration & transformation"], "weights": [31, 20, 18, 21, 10], "questions": [{"id": 1, "examId": "snowpro-core-cof-c03", "domain": 1, "objective": "1.4", "concept": "Concurrency versus query capacity", "q": "A retailer runs many short dashboard queries on one warehouse. At the morning peak, queries queue for several minutes but execute quickly once admitted. The account supports multi-cluster warehouses. Which change best targets this bottleneck?", "options": ["Add a clustering key to every dashboard table", "Increase the Time Travel retention period", "Configure multi-cluster auto-scaling with appropriate cluster bounds", "Keep one cluster and clear its local cache every hour"], "answer": 2, "kind": "single", "why": "Additional clusters can handle concurrent demand when queries individually execute quickly.", "hint": "Distinguish waiting for a compute slot from slow execution after a query has started.", "clues": [{"text": "queries queue for several minutes", "why": "Distinguish waiting for a compute slot from slow execution after a query has started."}], "keyPoints": ["queries queue for several minutes"], "analysis": "Identify the deciding requirement, then compare each option against it.", "trap": "A nearby feature can be valid but address a different requirement.", "reasons": ["Clustering can improve scans but does not directly create capacity for concurrent queries.", "Retention changes historical acce
