st with representative roles, including privilege inheritance."}, {"title": "Load files or stream rows", "body": "A stage references files. COPY INTO a table loads files; COPY INTO a location unloads data. Snowpipe continuously loads staged files. Snowpipe Streaming ingests rows. CSV options differ from JSON options; validate malformed records rather than silently losing them.", "recall": "COPY INTO @stage goes into or out of a table?", "answer": "Out: it unloads query or table data to files.", "exercise": "Write a plan for CSV files with a header and occasional malformed rows.", "solution": "Define the correct CSV format with SKIP_HEADER=1, stage the files, validate compatible COPY loads, inspect errors, reconcile loaded/rejected counts, then automate ingestion and monitor failures."}, {"title": "Recover and tune with evidence", "body": "Time Travel uses retained history with AT or BEFORE and supports UNDROP. Transient tables have at most one day of Time Travel and no Fail-safe. Pruning skips irrelevant micro-partitions using metadata. A warehouse local cache is lost on suspension; persisted results are a separate cache.", "recall": "Can an Enterprise-level edition give a transient table 90 days of retention?", "answer": "No. Transient table retention is limited to zero or one day.", "exercise": "A cold warehouse scans 42 of 18,500 partitions. Explain why, then propose a recovery for an accidental drop.", "solution": "Metadata pruning skips partitions that cannot match the filter, independent of a warm warehouse cache. Use UNDROP for a supported dropped table while retained history remains available."}, {"title": "Share data and orchestrate work", "body": "Consumers typically supply their own warehouse compute when querying shared data. Reader-account arrangements differ. Tasks execute scheduled or triggered SQL; streams track supported table changes. Partner Connect integrates selected third-party tools.", "recall": "Which object tracks changes, and which executes ENDED controls whether the new warehouse is initially suspended."}, {"front": "A team needs semantic retrieval over support documents in Snowflake. Which capability is designed for this search use case?", "back": "Cortex Search provides low-latency hybrid retrieval over text, useful as a retrieval component for search and RAG."}, {"front": "A role needs to query a table in an existing database and schema. Which combination is generally required?", "back": "Data access follows container and object privileges. An executing role also needs access to an available warehouse when compute is required."}, {"front": "A view should return only rows belonging to the current user’s business unit. Which policy is intended for this purpose?", "back": "Row access policies determine whether a row is visible based on an expression and execution context."}, {"front": "An auditor asks which identity authenticated and when. Where should an engineer start?", "back": "Login history provides authentication event information. Account Usage views can have latency, so choose the interface and time range appropriately."}, {"front": "A team wants future tables in a schema to receive SELECT automatically for a reader role. What should it configure?", "back": "Future grants define privileges to apply when new objects of the specified type are created. Existing objects need appropriate current grants too."}, {"front": "A pipeline loads staged CSV files into a table using an explicit SQL command. Which command performs that load?", "back": "COPY INTO a table loads staged files. COPY INTO a location unloads query data."}, {"front": "A CSV file has one header row that must not load as data. Which file-format option fits?", "back": "SKIP_HEADER specifies the number of header lines to skip for CSV input."}]}, {"id": "mla-c02", "title": "AWS ML Engineer Associate", "code": "MLA-C02", "domains": ["Data preparation", "Model & foundation model development", "Deployment & orchestration", "Operating, monito function hubCurrent(){const s=hubState().session;return s&&hubPool().find(q=>q.id===s.ids[s.index])}
function hubOrder(q){const s=hubState().session;if(!s.orders||typeof s.orders!=='object')s.orders={};if(!Array.isArray(s.orders[q.id])||s.orders[q.id].length!==q.options.length)s.orders[q.id]=shuffle(q.options.map((_,i)=>i));return s.orders[q.id]}
function hubChoice(){const s=hubState().session;return s.drafts?.[s.ids[s.index]]}
function hubCorrect(q,c){if(!validChoice(q,c))return false;if(q.kind==='single')return c===q.answer;if(q.kind==='multi')return [...c].sort((a,b)=>a-b).join(',')===[...q.answer].sort((a,b)=>a-b).join(',');return c.every((v,i)=>v===q.answer[i])}
function hubAnswerReady(q,c){if(q.kind==='multi')return Array.isArray(c)&&c.length>0&&c.every(i=>Number.isInteger(i)&&i>=0&&i<q.options.length);return validChoice(q,c)}
function hubQuiz(){if(!hubSessionValid()){hubState().session=null;hubSave();return hubHome()}hubScreen='quiz';const s=hubState().session,q=hubCurrent(),c=hubChoice(),a=s.answers[s.index],isMock=s.mode==='mock';if(isMock&&Date.now()>=s.deadline)return hubSubmit();const order=hubOrder(q);hubSave();let controls='';if(q.kind==='single'||q.kind==='multi'){controls=order.map(i=>`<button class="hub-option ${(q.kind==='single'?c===i:Array.isArray(c)&&c.includes(i))?'chosen':''}" data-hub="choice" data-value="${i}" ${a?'disabled':''} aria-pressed="${q.kind==='single'?c===i:!!(Array.isArray(c)&&c.includes(i))}"><span>${q.kind==='multi'?'□':'○'}</span> ${esc(q.options[i])}</button>`).join('')}else{controls=(q.kind==='match'?q.prompts:q.answer.map((_,i)=>'Position '+(i+1))).map((label,i)=>`<label class="hub-select">${esc(label)}<select data-hub-select="${i}" ${a?'disabled':''}><option value="">Choose…</option>${order.map(j=>`<option value="${j}" ${Array.isArray(c)&&c[i]===j?'selected':''}>${esc(q.options[j])}</option>`).join('')}</select></label>`).join('')}hubPaint(`<div class="hub-bar"><span>${isMock?'TIMED MINI MOCK':'LEARN & PRACTICE'} · ${s.index+1}/${s.ids.length}</span>${isMock?'<strong id="hub-clock" role="timer"></strong>':''}</div><progress max="${s.ids.length}" value="${s.index+1}" aria-label="Question progress"></progress><section class="card"><span class="eyebrow">${esc(hubPack().domains[q.domain-1])}</span><h2 class="hub-question">${esc(q.q)}</h2><p class="small">${q.kind==='multi'?'Select every correct option. No partial credit.':q.kind==='order'?'Set every position, without duplicates.':q.kind==='match'?'Match every prompt, without duplicates.':'Choose one answer.'}</p><div class="hub-options">${controls}</div>${!isMock&&!a?`${hubButton('Show a hint','hint','',true)}${s.assisted.includes(q.id)?`<aside class="hub-hint">${esc(q.hint)}</aside>`:''}`:''}<div class="hub-actions">${hubButton(hubState().flags.includes(q.id)?'★ Flagged':'☆ Flag for review','flag','',true)}${isMock?hubButton(s.index===s.ids.length-1?'Review & submit':'Save & next','advance'):a?hubButton(s.index===s.ids.length-1?'Finish session':'Next question','next'):hubButton('Check answer','check')}</div>${a&&!isMock?hubExplanation(q,c):''}</section>${isMock?`<div class="hub-jump" aria-label="Question navigation">${s.ids.map((id,i)=>`<button data-hub="jump" data-value="${i}" aria-label="Question ${i+1}${s.drafts[id]!==undefined?', answered':''}" ${i===s.index?'aria-current="step"':''}>${i+1}${s.drafts[id]!==undefined?' •':''}</button>`).join('')}</div>${hubButton('Review & submit mini mock','confirm','',true)}`:''}${hubButton('Save & return to study path','home','',true)}`);if(isMock){const tick=()=>{const left=Math.max(0,Math.ceil((s.deadline-Date.now())/1000)),el=document.querySelector('#hub-clock');if(el)el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left)hubSubmit()};tick();hubTimer=setInterval(tick,1000)}}
function hubExplanation(q,c){return `<section class="hub-explanation"><h3>${hubCorrect(q,c)?'Correct — now explain why.':'Let’s make the distinction clear.'}</h3><p>${esc(q.why)}</p><details><summary>Why each option does or does not fit</summary>${q.options.map((o,i)=>`<p><strong>${esc(o)}</strong><br>${esc(q.reasons[i])}</p>`).join('')}</details>${q.trap?`<p><strong>Watch the trap:</strong> ${esc(q.trap)}</p>`:''}<a href="${esc(q.source)}" target="_blank" rel="noopener">Read the source ↗</a></section>`}
function hubChoose(n){const s=hubState().session,q=hubCurrent();if(!q||s.answers[s.index])return;if(!s.drafts)s.drafts={};if(q.kind==='single')s.drafts[q.id]=n;else if(q.kind==='multi'){const old=Array.isArray(hubChoice())?hubChoice():[];s.drafts[q.id]=old.includes(n)?old.filter(i=>i!==n):[...old,n]}hubSave();hubQuiz()}
function hubCheck(){const s=hubState().session,q=hubCurrent(),c=hubChoice();if(!q||s.mode==='mock'||s.answers[s.index])return;if(!hubAnswerReady(q,c))return hubMessage('Choose a complete answer first.');const a={id:q.id,choice:c,correct:hubCorrect(q,c),assisted:s.assisted.includes(q.id),at:Date.now(),mode:s.mode};s.answers[s.index]=a;hubState().attempts.push(a);hubSave();hubQuiz()}
function hubNext(){const s=hubState().session;if(!s?.answers[s.index])return;if(s.index<s.ids.length-1){s.index++;hubSave();hubQuiz()}else hubFinishPractice()}
function hubFinishPractice(){const s=hubState().session;hubState().results.push({at:Date.now(),mode:s.mode,answers:s.answers.filter(Boolean),count:s.ids.length});hubState().session=null;hubSave();hubResults()}
function hubMessage(message){let el=document.querySelector('#hub-message');if(!el){el=document.createElement('p');el.id='hub-message';el.className='toast';el.setAttribute('role','status');document.querySelector('#main').appendChild(el)}el.textContent=message}
function hubConfirm(){const s=hubState().session;if(!s||s.mode!=='mock')return;hubScreen='confirm';const unanswered=s.ids.filter(id=>{const q=hubPool().find(q=>q.id===id);return !hubAnswerReady(q,s.drafts[id])}).length;hubPaint(`<section class="card"><h1>Ready to submit?</h1><p>${unanswered} unanswered question${unanswered===1?'':'s'}. Unanswered or incomplete responses count as incorrect. Answers will be revealed after submission.</p><p>The timer continues while you review this screen.</p>${hubButton('Submit & reveal answers','submit')}${hubButton('Return to questions','resume','',true)}</section>`);hubTimer=setInterval(()=>{if(Date.now()>=s.deadline)hubSubmit()},1000)}
function hubSubmit(){const s=hubState().session;if(!s||s.mode!=='mock')return;const answers=s.ids.map(id=>{const q=hubPool().find(q=>q.id===id),choice=s.drafts[id];return {id,choice,correct:hubCorrect(q,choice),assisted:false,at:Date.now(),mode:'mock'}});hubState().attempts.push(...answers);hubState().results.push({at:Date.now(),mode:'mock',count:s.ids.length,answers,expired:Date.now()>=s.deadline});hubState().session=null;hubSave();hubResults(true)}
function hubResults(reveal=false){hubScreen='results';const p=hubPack(),s=hubState(),latest=hubLatest(),last=s.results[s.results.length-1];hubPaint(`<h1>Your learning evidence.</h1><p>Latest unaided responses are shown by domain. Repeated questions are not fresh exam evidence. Assisted answers stay in learning history but do not count below.</p>${last?`<section class="card"><span class="eyebrow">LAST ${last.mode==='mock'?'MINI MOCK':'PRACTICE SESSION'}</span><h2>${last.answers.filter(a=>a.correct).length}/${last.count} correct</h2><p>${Math.round(last.answers.filter(a=>a.correct).length/last.count*100)}% raw score${last.expired?' · timer ended':''} · ${last.answers.filter(a=>a.assisted).length} assisted answers</p><p class="small">No official scaled-score conversion or predicted pass.</p>${last.mode==='mock'?hubButton('Review submitted answers','review-result','',true):''}</section>`:''}<div class="hub-domain-list">${p.domains.map((d,i)=>{const bank=p.questions.filter(q=>q.domain===i+1),a=bank.map(q=>latest.get(q.id)).filter(Boolean),right=a.filter(a=>a.correct).length;return `<section class="card"><div class="hub-bar"><h3>${esc(d)}</h3><span>${p.weights[i]}% exam weight</span></div><p>${a.length?`${right}/${a.length} latest unaided correct`:'No unaided evidence yet'} · ${bank.length} candidate questions in this build</p><progress max="${a.length||1}" value="${right}" aria-label="${esc(d)} latest unaided correct"></progress>${hubButton('Practice this domain','domain',i+1,true)}</section>`}).join('')}</div><div class="hub-actions">${hubButton('Practice missed questions','start','review')}${hubButton('Practice flagged questions','start','flagged',true)}${hubButton('Back to study path','home','',true)}</div>${reveal?'<p class="toast">Submitted. You can now open the answer review.</p>':''}`)}
function hubReviewResult(){const r=hubState().results.filter(r=>r.mode==='mock').slice(-1)[0];if(!r)return hubResults();hubScreen='review-result';hubPaint(`<h1>Submitted answer review</h1>${r.answers.map((a,i)=>{const q=hubPool().find(q=>q.id===a.id);return q?`<article class="card"><span class="eyebrow">QUESTION ${i+1} · ${a.correct?'CORRECT':'REVISIT'}</span><h2 class="hub-question">${esc(q.q)}</h2><p>Your answer: ${a.choice===undefined?'Unanswered':(Array.isArray(a.choice)?a.choice:[a.choice]).map(n=>esc(q.options[n]||'Incomplete')).join(' / ')}</p>${hubExplanation(q,a.choice)}</article>`:''}).join('')}${hubButton('Back to progress','results','',true)}`)}
function hubPlan(){hubScreen='plan';const p=hubPack(),s=hubState(),days=Math.min(90,Math.max(1,Number(s.plan.days)||8)),mins=Math.min(240,Math.max(10,Number(s.plan.minutes)||120)),day=Math.min(days,Math.floor((Date.now()-s.plan.start)/DAY_MS)+1);hubPaint(`<h1>Make room for learning.</h1><section class="card"><label>Days available <input id="hub-days" type="number" min="1" max="90" value="${days}"></label><label>Minutes per day <input id="hub-minutes" type="number" min="10" max="240" value="${mins}"></label>${hubButton('Update my plan','save-plan')}<p>Day ${day} of ${days} · ${days*mins} minutes planned. This is a time budget, not a readiness promise.</p></section><div class="hub-plan-list">${Array.from({length:days},(_,i)=>{const d=p.domains[i%p.domains.length],final=i===days-1;return `<section class="card"><span class="eyebrow">DAY ${i+1}${i+1===day?' · TODAY':''}</span><h3>${final?'Mixed mini mock & mistake review':esc(d)}</h3><p>${Math.round(mins*.4)}m understand · ${Math.round(mins*.4)}m ${final?'mini mock':'practice'} · ${mins-Math.round(mins*.4)*2}m recall & review</p><p class="small">${final?'Review wrong and uncertain decisions after submission.':'Read the lesson, explain it without notes, practice its domain, then review due cards.'}</p></section>`}).join('')}</div>${hubButton('Back to study path','home','',true)}`)}
function hubLessons(){hubScreen='lessons';const p=hubPack(),l=p.lessons[hubLesson]||p.lessons[0];hubPaint(`<h1>Understand the decision.</h1><div class="hub-jump">${p.lessons.map((x,i)=>`<button data-hub="lesson" data-value="${i}" ${i===hubLesson?'aria-current="page"':''}>${i+1}. ${esc(x.title)}${hubState().done.includes(i)?' ✓':''}</button>`).join('')}</div><article class="card"><span class="eyebrow">LESSON ${hubLesson+1}/${p.lessons.length}</span><h2>${esc(l.title)}</h2><p>${esc(l.body)}</p><h3>Close the notes. Explain it.</h3><p>${esc(l.recall)}</p><textarea aria-label="Your recall answer" placeholder="Say it aloud or jot down your explanation…"></textarea><details><summary>Compare your explanation</summary><p>${esc(l.answer)}</p></details>${hubButton(hubState().done.includes(hubLesson)?'Lesson completed ✓':'Mark lesson complete','complete-lesson')}</article>${hubButton('Try a practical exercise','labs','',true)}${hubButton('Back to study path','home','',true)}`)}
function hubCards(){hubScreen='cards';const p=hubPack(),s=hubState();const due=p.cards.map((c,i)=>i).filter(i=>!s.cards[i]||s.cards[i].due<=Date.now());if(!due.length)return hubPaint(`<section class="card"><h1>Recall session complete.</h1><p>No cards due now. Spaced review works best after a delay; return tomorrow.</p>${hubButton('Back to study path','home')}</section>`);if(!due.includes(hubCard))hubCard=due[0];const c=p.cards[hubCard];hubPaint(`<span class="eyebrow">ACTIVE RECALL · ${due.length} CARDS DUE</span><h1>Think before you flip.</h1><article class="card hub-flash"><p class="hub-question">${esc(hubFace?c.back:c.front)}</p>${hubFace?`<div class="hub-actions">${hubButton('Again · 10 minutes','rate-card','again',true)}${hubButton('Hard · 1 day','rate-card','hard',true)}${hubButton('Got it · spaced review','rate-card','good')}</div><p class="small">Rate recall honestly. Re-reading is different from retrieving the idea unaided.</p>`:hubButton('Show answer','flip')}</article>${hubButton('Back to study path','home','',true)}`)}
function hubDrills(){hubScreen='drills';hubPaint(`<h1>Practice where it matters.</h1><p>Drills reveal reasoning after each answer. They are learning sessions, not scored mock exams.</p><div class="hub-tool-grid">${hubPack().domains.map((d,i)=>`<button class="hub-tool" data-hub="domain" data-value="${i+1}"><strong>${esc(d)}</strong><span>${hubPack().weights[i]}% exam weight · up to 10 questions</span></button>`).join('')}</div>${hubButton('Back to study path','home','',true)}`)}
function hubMock(){hubScreen='mock';const p=hubPack(),n=Math.min(30,hubPool().length);hubPaint(`<section class="card"><span class="eyebrow">TIMED MINI MOCK</span><h1>Make the call. Then review.</h1><p>${n} questions sampled without replacement. Choices are shuffled and your draft is saved. No hints or explanations until you submit. Unanswered items count as incorrect; multiple-response items require the exact set.</p><p>${esc(p.officialFormat)}</p><p class="small">This bank is not large enough to promise multiple unseen full-length exams. A retake can contain familiar questions.</p>${hubButton('Start timed mini mock','start','mock')}${hubButton('Back to study path','home','',true)}</section>`)}
function hubLabs(){hubScreen='labs';hubPaint(`<h1>Put the idea to work.</h1><p>Offline guided exercises. These do not connect to a cloud account or create chargeable resources.</p>${hubPack().lessons.map((l,i)=>`<article class="card"><span class="eyebrow">EXERCISE ${i+1}</span><h2>${esc(l.title)}</h2><p>${esc(l.exercise)}</p><textarea data-hub-note="${i}" aria-label="Your exercise ${i+1} solution" placeholder="Write your steps, checks and expected outcome…">${esc(hubState().notes?.[i]||'')}</textarea><details><summary>Compare with a worked approach</summary><p>${esc(l.solution)}</p></details><p class="small">Self-check: explain the mechanism, reject the nearest alternative, and name the evidence that would verify success.</p></article>`).join('')}${hubButton('Back to study path','home','',true)}`)}
function hubPlaybook(){hubScreen='playbook';hubPaint(`<h1>Read for the constraint.</h1><section class="card"><ol><li>Identify the requested output, workload and decision.</li><li>Underline the decisive constraint mentally: latency, freshness, access, cost or recovery.</li><li>Eliminate options that solve a different problem.</li><li>For multiple-response questions, verify every selection independently.</li><li>Flag uncertainty, keep moving, and return with your remaining time.</li></ol><p>After practice, explain why the closest wrong option fails. Review that concept again after a delay.</p></section><section class="card"><h2>${esc(hubPack().code)} format note</h2><p>${esc(hubPack().officialFormat)}</p><a href="${esc(hubPack().source)}" target="_blank" rel="noopener">Check official exam information ↗</a></section>${hubButton('Back to study path','home','',true)}`)}
function hubReferences(){hubScreen='reference';const p=hubPack();hubPaint(`<h1>See the distinction.</h1><p>Read the requirement first. Then compare the mechanism and the closest alternative.</p>${(p.references||p.lessons.map(l=>({title:l.title,headers:['Recall','Decision'],rows:[[l.recall,l.answer]],source:p.source}))).map(t=>`<section class="card"><h2>${esc(t.title)}</h2><div class="hub-table-scroll"><table><thead><tr>${t.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><a href="${esc(t.source)}" target="_blank" rel="noopener">Check official details ↗</a></section>`).join('')}${hubButton('Back to study path','home','',true)}`)}
function hubGlossary(query=''){hubScreen='glossary';const p=hubPack(),terms=p.glossary||p.lessons.map(l=>[l.title,l.body,l.answer]),filtered=terms.filter(t=>t.join(' ').toLowerCase().includes(query.toLowerCase()));hubPaint(`<h1>Words that make it click.</h1><label>Find a term<input id="hub-term-search" type="search" value="${esc(query)}" placeholder="Try RAG, recall or a service name"></label>${hubButton('Search terms','search-terms')}<p>${filtered.length} matching entries</p>${filtered.map(([term,meaning,example])=>`<section class="card"><h2>${esc(term)}</h2><p>${esc(meaning)}</p><p><strong>In practice:</strong> ${esc(example)}</p></section>`).join('')}${hubButton('Back to study path','home','',true)}`)}
function hubRoute(action,value){switch(action){case 'reset':hubScreen='reset';return hubPaint(`<section class="card"><h1>Reset this exam?</h1><p>This clears this exam’s saved practice, plan, cards and notes on this device. Other exam progress stays in place. It does not cancel any purchase.</p>${hubButton('Clear this exam’s progress','reset-confirm')}${hubButton('Keep my progress','home','',true)}</section>`);case 'reset-confirm':hubMemory.exams[hubPack().id]=hubFresh();hubSave();return hubHome();case 'reference':return hubGate(hubReferences);case 'glossary':return hubGate(()=>hubGlossary());case 'search-terms':return hubGate(()=>hubGlossary(document.querySelector('#hub-term-search').value));case 'catalog':return hubCatalog();case 'open':return hubOpen(value);case 'home':return hubHome();case 'pack':return hubPackPage();case 'legacy':clearInterval(hubTimer);hubTimer=null;return go('home');case 'demo':if(!HUB_PREVIEW)return;hubState().demo=!hubState().demo;hubSave();return hubHome();case 'start':return hubStart(value);case 'replace':{let v;try{v=JSON.parse(value)}catch(e){return}return hubNewSession(v.mode,v.domain)}case 'resume':return hubQuiz();case 'choice':return hubChoose(Number(value));case 'hint':{const s=hubState().session,q=hubCurrent();if(!q||s.mode==='mock')return;if(!s.assisted.includes(q.id))s.assisted.push(q.id);hubSave();return hubQuiz()}case 'flag':{const id=hubCurrent()?.id;if(!id)return;const s=hubState();s.flags=s.flags.includes(id)?s.flags.filter(x=>x!==id):[...s.flags,id];hubSave();return hubQuiz()}case 'check':return hubCheck();case 'next':return hubNext();case 'advance':{const s=hubState().session;if(s.index===s.ids.length-1)return hubConfirm();s.index++;hubSave();return hubQuiz()}case 'jump':{const s=hubState().session;if(s?.mode==='mock'&&Number(value)>=0&&Number(value)<s.ids.length){s.index=Number(value);hubSave();return hubQuiz()}return}case 'confirm':return hubConfirm();case 'submit':return hubSubmit();case 'results':return hubResults();case 'review-result':return hubReviewResult();case 'plan':return hubGate(hubPlan);case 'save-plan':{const days=Number(document.querySelector('#hub-days').value),minutes=Number(document.querySelector('#hub-minutes').value);if(!Number.isInteger(days)||days<1||days>90||!Number.isInteger(minutes)||minutes<10||minutes>240)return hubMessage('Use 1–90 days and 10–240 minutes per day.');hubState().plan={days,minutes,start:Date.now()};hubSave();return hubPlan()}case 'lessons':return hubGate(()=>{hubLesson=0;hubLessons()});case 'lesson':hubLesson=Number(value);return hubGate(hubLessons);case 'complete-lesson':if(!hubState().done.includes(hubLesson))hubState().done.push(hubLesson);hubSave();return hubLessons();case 'cards':return hubGate(()=>{hubFace=false;hubCards()});case 'flip':hubFace=true;return hubCards();case 'rate-card':{if(!hubPaid())return hubPackPage();const s=hubState(),old=s.cards[hubCard]||{interval:0};const interval=value==='again'?10/1440:value==='hard'?1:Math.min(30,Math.max(2,(old.interval||1)*2));s.cards[hubCard]={interval,due:Date.now()+interval*DAY_MS};hubSave();hubFace=false;return hubCards()}case 'drills':return hubGate(hubDrills);case 'domain':return hubGate(()=>hubStart('drill',Number(value)));case 'mock':return hubGate(hubMock);case 'labs':return hubGate(hubLabs);case 'playbook':return hubPlaybook()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-hub]');if(b){e.preventDefault();hubRoute(b.dataset.hub,b.dataset.value||'')}});
document.addEventListener('change',e=>{if(e.target.matches('[data-hub-select]')){const q=hubCurrent(),s=hubState().session;if(!q||s.answers[s.index])return;const v=e.target.value===''?null:Number(e.target.value),c=Array.isArray(hubChoice())?[...hubChoice()]:Array(q.options.length).fill(null);c[Number(e.target.dataset.hubSelect)]=v;s.drafts[q.id]=c;hubSave()} });
document.addEventListener('input',e=>{if(e.target.matches('[data-hub-note]')){hubState().notes=hubState().notes||{};hubState().notes[e.target.dataset.hubNote]=e.target.value.slice(0,12000);hubSave()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&hubState().session?.mode==='mock'&&Date.now()>=hubState().session.deadline){hubSubmit()}});
const legacyAppBack=window.appBack;
window.appBack=()=>{if(tab!=='study')return legacyAppBack();if(document.querySelector('#zami-welcome')){finishWelcome();return true}if(hubScreen==='catalog')return false;if(hubScreen==='home')hubCatalog();else hubHome();return true};
// Keep the original AWS practice and migration functions intact behind its dedicated entry.
catalog=hubCatalog;

let hubLegacy=false;
const legacyGo=go;
go=function(t){if(t==='catalog'){hubLegacy=false;return hubCatalog()}if(!hubLegacy&&tab==='study'){const routes={home:hubHome,learn:()=>hubGate(hubLessons),progress:hubResults,packs:hubPackPage};if(routes[t])return routes[t]()}return legacyGo(t)};
const hubRouteBase=hubRoute;
hubRoute=function(action,value){if(action==='legacy'){hubLegacy=true;clearInterval(hubTimer);hubTimer=null;return legacyGo('home')}if(action==='open'||action==='catalog')hubLegacy=false;return hubRouteBase(action,value)};

// HUB_ENGINE_END
render();
if(typeof location!=='undefined'&&location.hash==='#android'){
 if(window.zamifyNativeVisible)window.startZamifyWelcome();
 document.addEventListener('visibilitychange',()=>{if(window.zamifyNativeVisible)window.startZamifyWelcome()});
}else if(typeof window.addEventListener==='function'){
 if(document.readyState==='complete')window.startZamifyWelcome();
 else window.addEventListener('load',window.startZamifyWelcome,{once:true});
 document.addEventListener('visibilitychange',window.startZamifyWelcome);
}
</script></body></html>
