certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "keyPoints": ["revenue in rand", "later label"]}, {"id": 2, "domain": 1, "q": "A model learns from emails already marked spam or safe. What is this?", "options": ["Unsupervised learning", "Reinforcement learning", "Supervised learning", "Pre-training only"], "answer": 2, "why": "Supervised learning uses labeled examples. The spam labels supply the target answers.", "clues": [{"text": "already marked", "why": "Known target labels are available during training."}], "hint": "Ask whether the desired answers are supplied with the examples.", "analysis": "The key condition is that training emails already have spam/safe labels. That is different from discovering groups without labels.", "trap": "Spam is the application; labeled examples determine the learning type.", "reasons": ["Unsupervised learning discovers structure without target labels.", "Reinforcement learning uses feedback about actions and rewards, not just labeled email examples.", "Supervised learning maps examples to known target labels.", "Pre-training describes a training stage, not the best description of these labeled examples."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Supervised learning", "transfer": "A labeled support-ticket set can train a model to predict the ticket category.", "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 3, "domain": 1, "q": "Which metric matters most when missing actual fraud is especially costly?", "options": ["Recall", "Precision", "Accuracy", "F1 score"], "answer": 0, "why": "Recall measures the proportion of actual fraud cases detected, directly addressing missed positives.", "clues": [{"text": "missing actual fraud", "why": "False negatives are the error the business most wants to reduce."}], "hint": "Focus on the costliest error, not a generic overall score.", "analysis": "Find the priority: catching actual fraud. Recall measures detected positives out of all actual positives.", "trap": "High accuracy can hide missed fraud when most transactions are legitimate.", "reasons": ["Recall measures the proportion of actual fraud cases detected, directly addressing missed positives.", "Precision measures how trustworthy positive fraud alerts are, rather than how many actual fraud cases were missed.", "Accuracy can be dominated by legitimate transactions when fraud is rare.", "F1 balances precision and recall; the stated priority specifically emphasizes missed fraud and therefore recall."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Recall and missed positives", "transfer": "A cancer-screening model should be checked for the share of actual cases it detects.", "difficulty": "Foundation", "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/canvas-metrics.html", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 4, "domain": 1, "q": "Which AWS service converts recorded speech into text?", "options": ["Amazon Polly", "Amazon Translate", "Amazon Comprehend", "Amazon Transcribe"], "answer": 3, "why": "Transcribe recognizes speech. Polly does the reverse: text to speech.", "clues": [{"text": "speech into text", "why": "Check the direction of conversion."}], "hint": "Identify what goes in and what must come out.", "analysis": "Audio is the input and a transcript is the output. Choose speech recognition rather than speech synthesis.", "trap": "Polly and Transcribe are easy to reverse: read the input/output direction.", "reasons": ["Polly generates speech from text, the reverse direction.", "Translate converts text between languages.", "Comprehend analyzes text; it does not transcribe audio.", "Transcribe converts speech recordings into text."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Speech to text", "transfer": "Recorded meeting audio needs transcription before it can be searched as text.", "source": "https://docs.aws.amazon.com/transcribe/latest/dg/", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 5, "domain": 1, "kind": "multi", "q": "Which TWO tasks should primarily use deterministic rules rather than a probabilistic model?", "options": ["Group customers by similar purchasing behavior", "Calculate a tax amount using an exact published formula", "Recognize objects in product photographs", "Enforce whether an identity has permission to read a restricted object", "Forecast next month’s sales"], "answer": [1, 3], "reasons": ["Grouping by similarity can use ML clustering.", "An exact formula should be computed directly rather than estimated.", "Object recognition is a common computer-vision task.", "Authorization must be enforced by a policy decision, not guessed by a model.", "Forecasting unknown future values is a common prediction task."], "why": "Exact formulas and permission enforcement require rule-based outcomes, while clustering, vision and forecasting can benefit from learned predictions.", "clues": [{"text": "deterministic rules", "why": "Choose tasks requiring exact calculation or an enforced access decision."}], "hint": "Look for exact outcomes, and select exactly two tasks.", "analysis": "Distinguish uncertain prediction from actions that must follow exact rules. Both the calculation and the authorization condition need deterministic enforcement.", "trap": "A model may help describe a rule, but it should not replace the calculation or authorization control.", "reviewedOn": "2026-10-31", "objective": "1.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Rules versus prediction", "transfer": "A precise payroll formula and an access rule should be enforced rather than estimated.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 6, "domain": 2, "q": "A team uses a model priced per input token. Two prompts ask the same question with different wording. Their word counts are equal, but their quoted input costs differ. Which measurement best explains the difference?", "options": ["The number of user requests submitted", "The number of complete words supplied", "The number of tokens produced by the model’s tokenizer", "The number of characters displayed to the user"], "answer": 2, "why": "Token-based input pricing uses the token count for the selected model. Equal word counts do not guarantee equal token counts.", "clues": [{"text": "priced per input token", "why": "The measurement must match the stated pricing unit."}], "hint": "Use the provider’s stated billing unit rather than a convenient text-length estimate.", "analysis": "The scenario specifies input-token pricing. Compare tokenized inputs using the same model and price; total inference cost can also include output tokens.", "trap": "Treating one word as exactly one token, or confusing input cost with the total bill.", "reasons": ["Both prompts are single requests; request count does not explain different input-token charges.", "A word may be represented by one or several tokens, so equal word counts can have different costs.", "The tokenizer determines the model’s input units, which are used for the stated pricing model.", "Character counts can be a rough proxy but are not the billing unit in this scenario."], "kind": "single", "reviewedOn": "2026-10-30", "objective": "2.1", "concept": "Tokens and input cost", "difficulty": "Foundation", "transfer": "Changing languages or including code can change token counts even when the request means the same thing.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "keyPoints": ["priced per input token", "word counts are equal"]}, {"id": 7, "domain": 2, "q": "A search app needs to find passages that mean something similar to a user’s query even when they use different words. What representation should it compare?", "options": ["Encrypted copies of the query and passages", "Numeric embedding vectors of the query and passages", "The number of tokens billed for each passage", "The model’s claimed confidence in its generated answer"], "answer": 1, "why": "Embedding vectors can be compared to retrieve semantically related content.", "clues": [{"text": "different words", "why": "Exact word matching can miss related meaning."}], "hint": "Look for a representation designed for semantic similarity rather than storage or billing.", "analysis": "Encode both query and passages with a compatible embedding model, then compare vectors; verify permissions and relevance before generating an answer.", "trap": "Treating a vector as encryption or a guarantee that a retrieved passage is correct.", "reasons": ["Encryption protects data but does not provide semantic similarity values.", "Embeddings represent features numerically for vector similarity search.", "Token counts measure input length, not meaning.", "A generated confidence claim is not a passage representation."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Embeddings for semantic search", "transfer": "“How do I cancel?” may retrieve a passage headed “termination procedure” through semantic vector similarity.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["different words"]}, {"id": 8, "domain": 2, "q": "A chatbot invents a believable citation. What is this called?", "options": ["Data poisoning", "Prompt injection", "Hallucination", "Model distillation"], "answer": 2, "why": "Fabricating a plausible citation is an example of hallucination: generated content without factual support.", "clues": [{"text": "invents a believable citation", "why": "The output sounds credible but lacks factual support."}], "hint": "Distinguish fluent wording from verified evidence.", "analysis": "The failure is fabricated factual content. Neither a confident tone nor a citation-shaped string proves truth.", "trap": "Do not treat a plausible citation as a checked source.", "reasons": ["Data poisoning corrupts training or source data; the scenario describes an unsupported generated assertion.", "Prompt injection involves instructions trying to redirect the system; no such attack is described.", "Fabricating a plausible citation is an example of hallucination: generated content without factual support.", "Distillation trains a smaller model from a teacher and is not the name for fabricated content."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Hallucination", "transfer": "A generated legal reference should be verified against the actual source before use.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 9, "domain": 2, "q": "A product team wants managed API access to foundation models from several providers and will select a model at request time. Which AWS service is the primary model-access layer?", "options": ["Amazon Bedrock Knowledge Bases", "Amazon SageMaker JumpStart", "Amazon Bedrock AgentCore Runtime", "Amazon Bedrock"], "answer": 3, "why": "Amazon Bedrock supplies the managed foundation-model access requested.", "clues": [{"text": "managed API access to foundation models from several providers", "why": "The requirement is model invocation, not retrieval or agent hosting."}], "hint": "Distinguish the model access layer from tools that can surround it.", "analysis": "Bedrock can be combined with Knowledge Bases for retrieval or AgentCore for operating agents; those are additional roles.", "trap": "Choosing a related Bedrock capability simply because it also appears in an AI application.", "reasons": ["Knowledge Bases adds retrieval for applications; it is not the general multi-provider model API.", "JumpStart helps discover and deploy pretrained models, but the scenario asks for the managed model API layer.", "AgentCore Runtime runs agents and tools, not the primary model catalogue/inference service.", "Bedrock provides managed access to foundation models from multiple providers."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Bedrock model access versus adjacent services", "transfer": "A team may compare provider models through Bedrock before adding a document knowledge base.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["managed API access to foundation models from several providers"]}, {"id": 10, "domain": 2, "kind": "match", "q": "An internal assistant must connect to tools, respect access limits, use changing policies and adopt a response style. Match each requirement to the most direct concept. Use each option once.", "options": ["IAM authorization", "Fine-tuning", "Model Context Protocol (MCP)", "Retrieval-Augmented Generation (RAG)"], "answer": [2, 0, 3, 1], "reasons": ["IAM policies control permitted actions on AWS resources; a tool connection does not grant those permissions.", "Fine-tuning adapts weights using training examples; it is different from inserting documents into a prompt.", "MCP standardizes connections to external tools and context; authorization is still needed.", "RAG retrieves relevant source material for the current request without retraining the foundation model."], "why": "MCP connects tools, IAM authorizes access, RAG supplies retrieved context and fine-tuning adapts model weights. These capabilities can complement one another.", "clues": [{"text": "most direct concept", "why": "Match each responsibility rather than choosing an entire architecture."}], "hint": "Distinguish connection, permission, runtime information and training.", "analysis": "Match the verb in each requirement to the capability. An application may use all four, but each requirement asks for one primary role.", "trap": "Assuming that connecting a tool authorizes it, or that retrieving a document trains the model.", "prompts": ["Standardize discovery and calls to supported external tools", "Decide which AWS resources its identity may access", "Supply current policy passages at request time", "Adapt model weights using approved response examples"], "reviewedOn": "2026-10-30", "objective": "2.1", "relatedObjectives": ["3.1", "3.3", "5.1"], "concept": "Connection, authorization, retrieval and training", "difficulty": "Applied", "transfer": "A connected expense tool still needs access checks; retrieving its latest policy does not change the model’s weights.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "keyPoints": ["most direct concept", "Use each option once"]}, {"id": 11, "domain": 3, "q": "An employee assistant must answer from a large policy library that changes daily and show supporting passages. The team will keep its existing foundation model. Which design best meets both requirements?", "options": ["Retrieve relevant passages from a synchronized policy index and attach source references", "Fine-tune weekly on the policies and ask the model to name its sources", "Cache generated policy answers and refresh them after users report changes", "Add a link to the policy website in the system prompt without retrieving its content"], "answer": 0, "why": "RAG can supply current, relevant policy passages and their source references at answer time. The source-to-index synchronization must also stay current.", "clues": [{"text": "changes daily", "why": "The information pipeline must reflect updates."}, {"text": "supporting passages", "why": "The answer needs retrieved evidence, not just a source name."}], "hint": "Check how each approach obtains updated evidence and makes it traceable.", "analysis": "Both daily changes and supporting passages matter. Choose current retrieval with source metadata, then check that answers are supported by the retrieved text.", "trap": "Assuming that a generated citation or a current-looking URL proves the answer is grounded.", "reasons": ["Retrieval from an updated index supplies both current evidence and traceable passages.", "Weekly training can lag daily changes, and naming a source is not evidence that its passage was retrieved.", "Cached answers can remain stale until a user notices; they do not meet the requirement for current supporting passages.", "A URL alone does not give the model access to the page or retrieve supporting text."], "kind": "single", "reviewedOn": "2026-10-30", "objective": "3.1", "concept": "RAG for current, traceable knowledge", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/rag-vs-fine-tuning.html", "transfer": "For a changing product catalogue, refresh retrieval data and check grounding; retraining alone does not supply current source passages.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "keyPoints": ["changes daily", "supporting passages", "existing foundation model"]}, {"id": 12, "domain": 3, "q": "A prompt includes three examples of the desired response. Which technique is used?", "options": ["Zero-shot", "Distillation", "Few-shot", "Pre-training"], "answer": 2, "why": "Few-shot prompting supplies examples in context. It does not update model weights.", "clues": [{"text": "three examples", "why": "The prompt demonstrates the desired behavior."}], "hint": "Count examples in the prompt, not model parameters.", "analysis": "Three demonstrations supplied in the prompt make this few-shot prompting. The model is not being trained on a new dataset.", "trap": "Examples in a prompt are not automatically fine-tuning.", "reasons": ["Zero-shot prompting does not supply task demonstrations.", "Distillation trains a student to learn from a teacher model.", "Few-shot prompting uses a small number of examples in context.", "Pre-training learns model parameters from a broad training corpus."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Few-shot prompting", "transfer": "Two example replies in a request can demonstrate the desired style without training.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 13, "domain": 3, "q": "Repeated runs of the same summarization prompt produce too much variation. The model exposes temperature and a maximum-output-token setting. The team wants less sampling randomness while retaining room for a complete summary. Which change best fits?", "options": ["Lower temperature while keeping the output-token budget unchanged", "Lower the output-token budget while keeping temperature unchanged", "Add stop sequences while keeping temperature unchanged", "Cache the first summary and reuse it for every later document"], "answer": 0, "why": "Lower temperature generally favors higher-probability next tokens, reducing sampling variation without directly shortening the output allowance.", "clues": [{"text": "less sampling randomness", "why": "The requested behavior is controlled by a sampling parameter."}], "hint": "Distinguish a sampling control from a length control or response reuse.", "analysis": "The requested change concerns variability, with output space preserved. Evaluate lower temperature on representative summaries and check factual accuracy separately.", "trap": "Assuming less randomness guarantees truth, or reducing length when the problem is variability.", "reasons": ["This adjusts sampling randomness while preserving room for the summary; it does not guarantee identical or factual responses.", "The token budget limits length and may truncate a summary, rather than directly controlling sampling randomness.", "Stop sequences terminate generation at specified text; they do not directly adjust the sampling distribution.", "Reusing one answer for different documents can return the wrong summary and does not tune generation."], "kind": "single", "reviewedOn": "2026-10-30", "objective": "3.1", "concept": "Temperature versus output length", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/inference-parameters.html", "transfer": "For repeated extraction tasks, lower temperature may improve consistency, but schema validation and factual checks remain necessary.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "keyPoints": ["less sampling randomness", "retaining room for a complete summary"]}, {"id": 14, "domain": 3, "q": "A team wants a smaller model to learn from a larger model’s outputs. What is this?", "options": ["Few-shot prompting", "Retrieval-augmented generation", "Prompt caching", "Model distillation"], "answer": 3, "why": "Distillation trains a smaller student to learn from a larger teacher model.", "clues": [{"text": "smaller model", "why": "A smaller student is learning from a larger teacher."}], "hint": "Distinguish training a student from retrieving documents.", "analysis": "The goal is transferring capabilities from a larger model to a smaller one. That is a model-training relationship rather than context retrieval.", "trap": "Do not confuse distillation with compressing a prompt.", "reasons": ["Few-shot prompting supplies examples at inference time without training a student model.", "RAG retrieves source material for context and does not itself train a student.", "Prompt caching reuses supported processing of repeated context rather than transferring model capabilities.", "Distillation trains a smaller student to learn from a larger teacher model."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Model distillation", "transfer": "A smaller student model can be trained using responses from a larger teacher.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/model-distillation.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 15, "domain": 3, "q": "A support agent answers questions fluently but customers still abandon cases when the agent cannot complete a required handoff. Which evaluation best measures whether the application meets the business goal?", "options": ["Measure completed cases, successful handoffs, user satisfaction and cost on representative cases", "Measure response helpfulness alone on a generic benchmark", "Measure the agent’s retrieval accuracy without checking the handoff", "Measure the foundation model’s raw token speed without task outcomes"], "answer": 0, "why": "Evaluate the full workflow against business outcomes and cost, not only a component’s output quality.", "clues": [{"text": "cannot complete a required handoff", "why": "The failure occurs after a plausible answer, at the workflow boundary."}], "hint": "Identify what a successful case requires beyond a good response.", "analysis": "Evaluate representative end-to-end tasks, including action outcomes and user experience. Component metrics help diagnose failures after the business result is measured.", "trap": "Treating a fluent response or good retrieval result as completed customer work.", "reasons": ["End-to-end cases and handoffs, with quality and cost, reflect the actual objective.", "Helpfulness on unrelated prompts can miss failure in the business workflow.", "Retrieval quality matters, but a correct document does not prove the handoff completes.", "Tokens per second can affect latency but cannot establish task completion."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.4", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A travel agent is useful when the booking completes correctly, not merely when its itinerary sounds helpful.", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "concept": "End-to-end agent evaluation", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["cannot complete a required handoff"]}, {"id": 16, "domain": 4, "q": "A hiring model has high overall accuracy. One demographic group reports more mistaken rejections, but few members of that group appear in the evaluation data. What is the best first investigation?", "options": ["Compare average model confidence across all applicants", "Compare subgroup false-rejection rates and whether each sample supports a reliable conclusion", "Remove demographic labels from the evaluation data and repeat the aggregate score", "Apply the same decision threshold to every group and report the original accuracy"], "answer": 1, "why": "Subgroup error rates investigate the reported harm, while sample adequacy determines how confidently those rates can be compared.", "clues": [{"text": "mistaken rejections", "why": "Investigate the relevant error, not confidence alone."}, {"text": "few members", "why": "A small sample can make comparisons unreliable."}], "hint": "Measure the reported harm for the affected group, then check the strength of the evidence.", "analysis": "A high average does not answer a subgroup question. Investigate error rates and representation before selecting a mitigation; handle demographic data with suitable privacy controls.", "trap": "Treating equal thresholds, confidence or aggregate accuracy as proof of fairness.", "reasons": ["Overall confidence can conceal subgroup errors and is not a measure of the reported false rejections.", "This directly investigates the reported error and the strength of the supporting evidence.", "Removing labels prevents the proposed subgroup comparison; it does not establish fairness.", "A common threshold alone does not establish comparable error rates or fix an inadequate evaluation sample."], "kind": "single", "reviewedOn": "2026-10-30", "objective": "4.1", "concept": "Fairness and subgroup evaluation", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raidp03-bp02.html", "transfer": "A service can score well overall while working poorly for a language or region with little evaluation data.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "keyPoints": ["mistaken rejections", "few members", "first investigation"]}, {"id": 17, "domain": 4, "q": "A loan model declines an application. A reviewer needs to explain which factors influenced this specific result without promising that the model is always right. Which capability helps most?", "options": ["A model card describing intended use for the model as a whole", "A case-level explanation of influential inputs, checked for its limits", "A CloudTrail record of who invoked an API", "A precision score aggregated across all applicants"], "answer": 1, "why": "Case-level explainability helps interpret influential factors in an individual prediction; it does not prove the decision is correct or fair.", "clues": [{"text": "this specific result", "why": "The reviewer needs reasons relevant to one outcome."}], "hint": "Distinguish a local explanation from a model-wide record or performance metric.", "analysis": "Use a suitable explanation method, check its faithfulness and provide a correction path where a person is affected.", "trap": "Treating aggregate performance or general model documentation as an explanation for a specific decision.", "reasons": ["A model card helps document overall use and limitations, but not necessarily this case’s factors.", "A case-level explanation can help interpret this outcome while still requiring validation.", "An API event log shows activity, not why the prediction was made.", "An aggregate metric does not explain the individual result."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "4.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Case-level explainability", "transfer": "A denied claim can show which submitted facts influenced the recommendation while preserving a human appeal.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "contentRevision": 2, "keyPoints": ["this specific result"]}, {"id": 18, "domain": 4, "q": "Which feature helps filter harmful content in a Bedrock application?", "options": ["Amazon Bedrock Guardrails", "AWS Identity and Access Management", "AWS CloudTrail", "Amazon Macie"], "answer": 0, "why": "Bedrock Guardrails provides configurable content safeguards, which should be evaluated alongside other controls.", "clues": [{"text": "filter harmful content", "why": "The required capability is a generation safeguard."}], "hint": "Choose a control that acts on model input or output.", "analysis": "Match a content-safety requirement to a configurable safeguard. Keep other controls and evaluation because filtering is imperfect.", "trap": "Guardrails reduce risk; they are not an absolute safety guarantee.", "reasons": ["Bedrock Guardrails provides configurable content safeguards, which should be evaluated alongside other controls.", "IAM controls authorization; it does not itself classify and filter generated harmful text.", "CloudTrail supports auditing account activity rather than directly filtering a response.", "Macie discovers sensitive data in S3; it is not the Bedrock response content-filter feature."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "4.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Content safeguards", "transfer": "A Bedrock application can evaluate both a user prompt and model response with Guardrails.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-how.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 19, "domain": 4, "q": "A marketing team plans to sell posters made with a generative image service. The source images and model terms have not been checked. What should the team do before commercial use?", "options": ["Check whether the output looks original to a colleague", "Assume generated images have no third-party rights because a model created them", "Use the output if a content filter did not block it", "Review input rights, service terms and intellectual-property risks for the intended use"], "answer": 3, "why": "Commercial use calls for a rights and risk review of the inputs, service terms and output before publication.", "clues": [{"text": "source images and model terms have not been checked", "why": "The unresolved issue concerns permission and terms for the intended use."}], "hint": "Find the action that addresses rights rather than visual quality or safety filtering.", "analysis": "Assess the source material, the model service terms and the intended publication. Seek qualified review where the stakes require it.", "trap": "Treating a content filter or originality impression as proof of commercial rights.", "reasons": ["Appearance alone does not establish legal permission or ownership.", "Generated content can still raise rights and contractual questions.", "A safety filter is not an intellectual-property clearance process.", "Input provenance, applicable terms and intended commercial use determine what needs review."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "4.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A team using generated product packaging should review the rights to uploaded reference art and the service terms.", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "concept": "GenAI intellectual-property risk", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["source images and model terms have not been checked"]}, {"id": 20, "domain": 4, "q": "An AI system recommends whether to deny a high-impact benefit claim. Staff often accept its recommendation without checking source evidence. What design most directly improves responsible oversight?", "options": ["Show a confidence number and automatically finalize high-confidence denials", "Log recommendations for later audit but give staff no way to override them", "Give reviewers the relevant evidence, authority to correct errors and a recorded review route", "Use a larger model and remove staff review to reduce delays"], "answer": 2, "why": "Human oversight needs useful evidence and a real path to intervene, not a nominal reviewer.", "clues": [{"text": "without checking source evidence", "why": "The human role currently lacks meaningful scrutiny."}], "hint": "Find the control that lets a person detect and change a wrong decision before harm.", "analysis": "Place human review where impact is high, present the right information and record the outcome. Test whether staff can actually correct mistakes.", "trap": "Calling a process “human in the loop” when the person cannot evaluate or override it.", "reasons": ["Confidence is not a substitute for evidence or a meaningful human decision.", "After-the-fact logs do not let reviewers prevent or correct a current error.", "Usable evidence and correction authority make oversight operational.", "A larger model can still make consequential mistakes."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "4.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Meaningful human oversight", "transfer": "A claims reviewer should see the cited policy and disputed facts before finalizing a denial.", "source": "https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/raiuc04-bp02.html", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["without checking source evidence"]}, {"id": 21, "domain": 5, "q": "An AI application should access only its required S3 objects. Apply which principle?", "options": ["Make the bucket publicly readable for easier access", "Use least-privilege IAM permissions", "Encrypt the bucket but grant broad read permissions", "Give the application a shared administrator credential"], "answer": 1, "why": "Least privilege restricts permitted actions and resources to those required for the application.", "clues": [{"text": "only its required S3 objects", "why": "Scope access to the actual task."}], "hint": "Look for the smallest sufficient permission boundary.", "analysis": "The application needs specific objects, so permissions should be limited to those resources and necessary actions.", "trap": "An application needing access does not justify broad account permissions.", "reasons": ["Public access exceeds the application’s need and may expose objects to others.", "Least privilege restricts permitted actions and resources to those required for the application.", "Encryption protects data but does not justify giving an application excess authorization.", "Administrator credentials exceed the required scope and weaken accountability when shared."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Least privilege", "transfer": "A document assistant should have read access only to the necessary S3 prefix.", "source": "https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html", "difficulty": "Applied", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 22, "domain": 5, "q": "Which AWS service records account API activity for auditing?", "options": ["Amazon CloudWatch metrics only", "AWS Config configuration history", "AWS CloudTrail", "AWS Artifact compliance reports"], "answer": 2, "why": "CloudTrail records supported account API events and related activity for audit and investigation.", "clues": [{"text": "API activity", "why": "The requirement is an audit trail of account actions."}], "hint": "Distinguish API auditing from model inference and text services.", "analysis": "The investigator needs records of supported account API events. Select the auditing service rather than language-processing capabilities.", "trap": "Logs serve different purposes; account activity is distinct from text generation.", "reasons": ["Operational metrics are not a substitute for an account API activity audit trail.", "Config tracks resource configuration; it does not replace the requested API event history.", "CloudTrail records supported account API events and related activity for audit and investigation.", "Artifact provides compliance documents rather than recording your account’s API calls."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "API activity audit", "transfer": "A team can inspect CloudTrail events when investigating a changed AWS resource.", "source": "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 23, "domain": 5, "q": "Which service helps discover sensitive data in Amazon S3?", "options": ["Amazon Macie", "AWS Key Management Service", "AWS CloudTrail", "AWS Identity and Access Management"], "answer": 0, "why": "Macie helps discover sensitive data in S3 objects.", "clues": [{"text": "sensitive data in Amazon S3", "why": "The goal is identifying sensitive content in stored objects."}], "hint": "Separate discovery of sensitive data from encryption of that data.", "analysis": "The combination of data discovery and S3 points to a purpose-built sensitive-data service. Discovery does not itself solve every protection requirement.", "trap": "Finding sensitive data is different from controlling who may read it.", "reasons": ["Macie helps discover sensitive data in S3 objects.", "KMS manages cryptographic keys; it does not perform the requested sensitive-content discovery.", "CloudTrail records account activity, not a content classification scan of S3 objects.", "IAM controls access permissions rather than discovering sensitive content."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Sensitive-data discovery", "transfer": "Macie can help find sensitive records in S3 objects before they feed a model.", "source": "https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 24, "domain": 5, "q": "A retrieved document tells an agent to reveal secrets. What is the main threat?", "options": ["An ordinary factual hallucination", "A training underfitting problem", "An output-length limit", "Prompt injection"], "answer": 3, "why": "Prompt injection attempts to redirect an AI system through untrusted instructions, such as retrieved text.", "clues": [{"text": "retrieved document", "why": "The instructions are arriving through untrusted source content."}], "hint": "Ask whether source data is being promoted into authority.", "analysis": "A document is attempting to redirect the agent and expose secrets. Treat retrieved content as
