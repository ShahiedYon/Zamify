ource, transformations and dataset version. This helps investigate quality, permissions and later model behavior.", "trap": "Mistaking a final file name or performance score for data provenance.", "reasons": ["Accuracy does not describe the data’s origins or changes.", "Lineage links origin and transformations to the final dataset for traceability.", "A filename lacks the upstream sources and processing history.", "Inference latency is operational evidence, not training-data provenance."], "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Training-data lineage", "transfer": "A merged sales dataset should retain the source system and normalization history of each field.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/datazone-data-lineage.html", "contentRevision": 2, "keyPoints": ["three systems with filtering and corrections"]}, {"id": 26, "domain": 1, "q": "A retailer groups customers by similar purchasing behavior without predefined segment labels. Which technique fits?", "options": ["Regression", "Clustering", "Binary classification", "Speech recognition"], "answer": 1, "why": "Clustering discovers groups based on similarity without predefined target labels.", "reasons": ["Regression predicts a numeric target, not unlabeled groups.", "Clustering discovers groups based on similarity without predefined target labels.", "Binary classification needs a defined two-class target rather than unknown segments.", "Speech recognition transcribes audio and is unrelated to this grouping task."], "clues": [{"text": "without predefined segment labels", "why": "The groups are not known targets."}], "hint": "Decide whether labels are given or groups must be discovered.", "analysis": "The desired output is customer groups, and no labels exist. This combines a grouping goal with unsupervised learning.", "trap": "Unlabeled does not automatically mean clustering; the grouping objective is also essential.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Clustering", "transfer": "Group stores with similar sales patterns without supplying target group labels.", "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-unsupervised.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 27, "domain": 1, "q": "A spam filter raises false alarms on legitimate emails. Which metric directly asks how many predicted spam emails really are spam?", "options": ["Recall", "Accuracy", "Precision", "Mean absolute error"], "answer": 2, "why": "Precision measures actual positives among predicted positives, matching alert reliability.", "reasons": ["Recall asks how many actual spam messages were found, not whether spam alerts are trustworthy.", "Accuracy mixes correct spam and safe predictions and may hide the relevant error.", "Precision measures actual positives among predicted positives, matching alert reliability.", "Mean absolute error measures numeric prediction error, not class-alert reliability."], "clues": [{"text": "predicted spam", "why": "The denominator is the set of positive predictions."}], "hint": "Write out which group appears after the phrase out of.", "analysis": "The question conditions on emails predicted as spam. Precision evaluates the correctness of that positive-prediction group.", "trap": "Precision and recall differ in their denominator, even when both discuss correct positives.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Precision and false alarms", "transfer": "Review how many flagged messages are actually spam when false alerts are costly.", "difficulty": "Foundation", "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/canvas-metrics.html", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 28, "domain": 1, "q": "A classifier achieves excellent training results but performs poorly on unseen examples. What is the most likely issue?", "options": ["Underfitting", "Overfitting", "Expected generalization", "High inference latency"], "answer": 1, "why": "Strong training results with poor unseen performance suggest fitting training-specific patterns that do not generalize.", "reasons": ["Underfitting generally produces inadequate performance even on the training data.", "Strong training results with poor unseen performance suggest fitting training-specific patterns that do not generalize.", "Expected generalization would produce adequate results on unseen examples too.", "Latency is response time and does not explain the described training-versus-test quality gap."], "clues": [{"text": "unseen examples", "why": "Generalization, not training memorization, is the concern."}], "hint": "Compare training performance with performance on new data.", "analysis": "A large training-versus-unseen performance gap suggests overfitting. Diagnose the gap rather than celebrating the training score.", "trap": "More training accuracy alone can worsen the actual problem.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Overfitting", "transfer": "A model that memorizes training examples can falter on suitable new cases.", "difficulty": "Foundation", "source": "https://docs.aws.amazon.com/machine-learning/latest/dg/model-fit-underfitting-vs-overfitting.html", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 29, "domain": 1, "kind": "order", "q": "A team has defined a churn-prediction goal and collected historical records. Order the remaining stages so the final test data does not influence model selection. Use each stage once.", "options": ["Train candidates and select settings using the training and validation sets", "Deploy the accepted model and monitor real-world outcomes", "Prepare suitable training, validation and untouched test sets", "Evaluate the selected model on the untouched test set against acceptance criteria"], "answer": [2, 0, 3, 1], "reasons": ["Training fits candidates; validation supports model selection without using final test results.", "Deployment follows an acceptable evaluation, and monitoring checks real-world behavior.", "Establish the splits before fitting; learn preprocessing parameters from training data and apply them to held-out data.", "Use the untouched test set for final assessment after model selection, rather than repeatedly tuning to its results."], "why": "Separate the data first, train and select using development data, evaluate on the untouched test set, then deploy only if acceptance criteria are met.", "clues": [{"text": "final test data does not influence model selection", "why": "Keep the test set separate from training and validation."}], "hint": "Identify when data must be reserved and which evidence should support the release decision.", "analysis": "The split must precede fitting and model selection. Test results should support a release decision rather than become another tuning signal; monitor after deployment.", "trap": "Selecting settings using the final test set, which makes the reported final assessment overly optimistic.", "reviewedOn": "2026-10-30", "objective": "1.3", "concept": "ML lifecycle and data leakage", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/prescriptive-guidance/latest/ml-operations-planning/splits-leakage.html", "transfer": "If you repeatedly change a prompt after reading its test results, reserve a fresh assessment set before claiming general performance.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "keyPoints": ["final test data does not influence model selection", "Use each stage once"]}, {"id": 30, "domain": 1, "q": "A website needs a prediction while a customer is waiting at checkout. Which inference pattern fits best?", "options": ["Nightly batch inference", "Real-time inference", "Offline model training", "Historical data labeling"], "answer": 1, "why": "Real-time inference serves low-latency predictions for interactive requests.", "reasons": ["Nightly batch processing does not return a result during the current checkout.", "Real-time inference serves low-latency predictions for interactive requests.", "Training creates or updates the model; it is not the live prediction step.", "Labeling prepares examples rather than responding to the customer."], "clues": [{"text": "while a customer is waiting", "why": "The result is needed during an interactive transaction."}], "hint": "Identify the required response time before selecting a processing pattern.", "analysis": "The checkout request needs an immediate prediction. Real-time inference matches this latency condition.", "trap": "A prediction workload is not necessarily a training workload.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Real-time inference", "transfer": "A checkout fraud decision needs a prediction during the transaction.", "difficulty": "Foundation", "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/deploy-model-options.html", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 31, "domain": 1, "q": "A company must score millions of stored records each night and deliver one output file before morning. No user waits for individual predictions. Which inference pattern is the most direct fit?", "options": ["A synchronous endpoint invoked separately by a waiting user", "An interactive streaming inference response", "Batch inference over the stored dataset", "Retrain the model for every record before predicting"], "answer": 2, "why": "Batch inference processes many stored inputs without a real-time response requirement.", "reasons": ["A synchronous user path adds an immediate-response pattern the task does not need.", "Streaming serves ongoing interactive output, not the requested overnight file job.", "Batch processing fits a large dataset and deferred output.", "Retraining per record is not an inference pattern for this requirement."], "clues": [{"text": "millions of stored records each night", "why": "The workload is large and scheduled rather than interactive."}], "hint": "Match the delivery time and input volume to the inference pattern.", "analysis": "Batch inference can process the dataset and write results for later use; check throughput and completion window.", "trap": "Assuming every prediction needs a live endpoint because the model is deployed.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Batch inference for scheduled data", "transfer": "A retailer can generate next-day demand scores for all stores overnight.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/batch-transform.html", "contentRevision": 2, "keyPoints": ["millions of stored records each night"]}, {"id": 32, "domain": 1, "q": "A mobile app must read a prepared text message aloud. Which AWS service fits?", "options": ["Amazon Transcribe", "Amazon Comprehend", "Amazon Translate", "Amazon Polly"], "answer": 3, "why": "Polly generates speech from text.", "reasons": ["Transcribe turns speech into text, the reverse direction.", "Comprehend analyzes text, such as sentiment or entities.", "Translate converts languages but does not supply the requested speech output.", "Polly generates speech from text."], "clues": [{"text": "text message aloud", "why": "Text is the input; audio is the output."}], "hint": "State the input and output formats before looking at the service names.", "analysis": "The task is text-to-speech synthesis. No transcription or language conversion is requested.", "trap": "Do not choose a speech-related service without checking the conversion direction.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Text to speech", "transfer": "An accessibility feature can speak a prepared article using Polly.", "source": "https://docs.aws.amazon.com/polly/latest/dg/what-is.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 33, "domain": 1, "q": "A game-playing model learns by taking actions and receiving rewards. Which learning approach fits?", "options": ["Supervised learning from fixed class labels", "Reinforcement learning", "Unsupervised clustering", "Numeric regression only"], "answer": 1, "why": "Reinforcement learning optimizes behavior based on interaction and rewards.", "reasons": ["Fixed labeled examples differ from learning through actions and reward signals.", "Reinforcement learning optimizes behavior based on interaction and rewards.", "Clustering discovers groups rather than a rewarded action policy.", "Regression predicts numbers; it does not describe the action-and-reward learning setup."], "clues": [{"text": "actions and receiving rewards", "why": "The feedback evaluates actions in an environment."}], "hint": "Ask how the learning system receives feedback.", "analysis": "Actions, environment feedback and rewards characterize reinforcement learning. The fact that it is a game is only supporting context.", "trap": "Not every game AI uses reinforcement learning; the described feedback mechanism determines the answer.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "1.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain1.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Reinforcement learning", "transfer": "A game agent can improve action choices from observed rewards.", "source": "https://docs.aws.amazon.com/sagemaker/latest/dg/algorithms-choose.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 34, "domain": 2, "q": "A company needs one model to interpret a product photo and answer a text question about it. Which capability is required?", "options": ["Text-only generation", "Multimodal understanding", "Text embedding generation only", "Speech transcription only"], "answer": 1, "why": "The model must understand both visual content and text to answer the request.", "reasons": ["A text-only model cannot directly interpret the product image.", "The model must understand both visual content and text to answer the request.", "Text embeddings alone do not provide the requested image interpretation and response.", "Speech transcription handles audio, not the product photo."], "clues": [{"text": "photo and answer a text question", "why": "Two input/output modalities are involved."}], "hint": "List the content formats that the model must handle.", "analysis": "The required capability spans image interpretation and language. Select support for both modalities.", "trap": "A model that generates images is not necessarily a model that understands image inputs.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Multimodal models", "transfer": "Answering a question about a chart image requires processing both image and text.", "difficulty": "Foundation", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 35, "domain": 2, "q": "An on-demand model charges per input and output token. Which change most directly reduces generation cost when answer quality remains acceptable?", "options": ["Increase the maximum output for every request", "Send all conversation history whether relevant or not", "Remove unnecessary prompt text and cap output while checking quality", "Fine-tune a larger model solely to increase its parameter count"], "answer": 2, "why": "For the stated token-priced model, reducing unnecessary input and output can lower cost while preserving the required quality.", "reasons": ["A larger output allowance can increase token usage instead of reducing it.", "Irrelevant history increases billed input without necessarily helping answer quality.", "For the stated token-priced model, reducing unnecessary input and output can lower cost while preserving the required quality.", "Increasing model size is not a direct remedy for excessive token use and may add costs."], "clues": [{"text": "per input and output token", "why": "Both sides of the interaction can affect billing."}], "hint": "Match the cost driver to the resource you can reduce.", "analysis": "This question explicitly states a token-based price. Trim irrelevant input and unnecessary output, then verify the answer still satisfies the task.", "trap": "The shortest answer is not automatically best if it loses necessary information.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Token-priced inference", "transfer": "Trim irrelevant conversation history and test that answer quality remains sufficient.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 36, "domain": 2, "q": "A team begins with a broadly pretrained model that can be adapted for summarization, question answering and classification. What kind of starting model is this?", "options": ["A foundation model", "A classifier trained only for one fixed label set", "A vector database index", "A deterministic access policy"], "answer": 0, "why": "A foundation model is broadly pretrained and usable across multiple downstream tasks.", "reasons": ["Broad pretraining and adaptability across tasks characterize a foundation model.", "A narrow classifier does not match the described multi-task starting point.", "An index stores representations; it is not the generative or predictive model.", "An access policy enforces permissions rather than learning broad task capability."], "clues": [{"text": "adapted for summarization, question answering and classification", "why": "The same starting model supports distinct tasks."}], "hint": "Ask whether the starting point is a broadly trained model or a task-specific component.", "analysis": "A foundation model may be used directly with prompting or adapted further; suitability still depends on task quality and cost.", "trap": "Confusing a store or a narrow classifier with a multi-purpose pretrained model.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Foundation model versus task-specific component", "transfer": "A single broadly trained model may support both document summaries and question answering through different prompts.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "contentRevision": 2, "keyPoints": ["adapted for summarization, question answering and classification"]}, {"id": 37, "domain": 2, "kind": "order", "q": "Order these stages in a simplified foundation-model lifecycle, including optional adaptation.", "options": ["Evaluate the adapted model against task requirements", "Pre-train the foundation model", "Deploy the model and collect feedback", "Select and curate suitable training data", "Adapt the model if the target task needs it"], "answer": [3, 1, 4, 0, 2], "reasons": ["Evaluate the result of training/adaptation before deployment.", "Pre-training requires selected and prepared data.", "Deployment follows evaluation; feedback can inform later iterations.", "Data selection and curation support the subsequent training stage.", "Task adaptation follows a base model and is not always necessary."], "why": "Curate data → pre-train → adapt if needed → evaluate → deploy and collect feedback.", "clues": [{"text": "including optional adaptation", "why": "Place adaptation after a base model exists and before its final task evaluation."}], "hint": "Trace the dependencies from source data to a deployed model.", "analysis": "The simplified sequence starts with data, produces a base model, optionally adapts it, evaluates suitability, then deploys with feedback.", "trap": "The ordered exercise is a simplified dependency chain; real projects can iterate and evaluate at multiple points.", "reviewedOn": "2026-10-31", "objective": "2.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Foundation-model lifecycle", "transfer": "Evaluate the adapted model before production use and monitor feedback after deployment.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 38, "domain": 2, "q": "An assistant can call an inventory tool, inspect the returned stock level and then decide whether to call a supplier tool to meet a user goal. What behavior distinguishes it from a fixed one-step response?", "options": ["Retrieving a static passage once", "Choosing subsequent actions from tool results toward a goal", "Converting input text into token IDs", "Storing a file in object storage"], "answer": 1, "why": "Agentic behavior includes selecting actions and using observations to pursue a goal.", "reasons": ["Retrieval can supply context but does not describe the action decision loop.", "The assistant selects and adapts tool actions based on intermediate results.", "Tokenization is part of model input processing, not the goal-directed loop.", "Object storage does not choose the next action."], "clues": [{"text": "decide whether to call a supplier tool", "why": "A later action depends on an earlier observation."}], "hint": "Identify the decision loop rather than a component the system might use.", "analysis": "Tool connections still require authorization and bounded actions; goal-directed choice does not itself grant permissions.", "trap": "Calling any chatbot or single retrieval step an agent merely because it uses an LLM.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Goal-directed tool use", "transfer": "A travel agent checks flight availability, then chooses a hotel search based on the selected destination.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "contentRevision": 2, "keyPoints": ["decide whether to call a supplier tool"]}, {"id": 39, "domain": 2, "q": "A startup can invoke a foundation model through a managed API or host the model on its own inference servers. It has little operations capacity and variable traffic. What is a likely reason to start with the managed API?", "options": ["It guarantees lower cost at every traffic level", "It reduces the servers and scaling infrastructure the startup operates directly", "It transfers all responsibility for output quality and access permissions to the provider", "It ensures identical latency and model availability in every Region"], "answer": 1, "why": "A managed API can reduce direct infrastructure operations; compare actual cost and latency for the workload.", "reasons": ["Costs depend on traffic and pricing; managed inference is not always cheaper.", "The provider operates much of the inference infrastructure, fitting limited operations capacity.", "The application owner still evaluates output and configures appropriate access.", "Region, capacity and model choice can affect availability and latency."], "clues": [{"text": "little operations capacity and variable traffic", "why": "The team values avoiding server management and scaling work."}], "hint": "Distinguish an operational advantage from guarantees about cost, quality or Region.", "analysis": "Managed and self-hosted inference have different cost and control tradeoffs. Benchmark representative use before scaling.", "trap": "Assuming managed eliminates customer responsibilities or guarantees the lowest bill.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A small support team may start with managed inference, then reassess hosting when sustained high-volume demand changes its economics.", "source": "https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost01-bp01.html", "concept": "Managed API versus self-hosted inference", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["little operations capacity and variable traffic"]}, {"id": 40, "domain": 2, "q": "An assistant has access to a policy index, a conversation history and tool descriptions. Before each model call, the application chooses the relevant portions that fit the task and context window. What practice is this?", "options": ["Context engineering", "Fine-tuning on the entire history", "Model distillation from a teacher", "Increasing temperature for varied answers"], "answer": 0, "why": "Choosing and structuring relevant runtime information for a model call is context engineering.", "reasons": ["Context engineering selects and structures useful runtime information for the request.", "Fine-tuning changes model weights; selecting passages at request time does not.", "Distillation trains a student model and does not describe runtime context selection.", "Temperature changes sampling, not which documents or tools are supplied."], "clues": [{"text": "chooses the relevant portions", "why": "Selection happens for the current request rather than in a training job."}], "hint": "Ask whether information is being supplied at request time or learned into weights.", "analysis": "Context selection can include retrieved passages, recent messages, instructions and tool definitions; relevance, permissions and token limits still matter.", "trap": "Confusing runtime context assembly with training or sampling settings.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Context engineering versus training", "transfer": "A claims assistant may include the latest policy section and only the recent messages needed for one case.", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "contentRevision": 2, "keyPoints": ["chooses the relevant portions"]}, {"id": 41, "domain": 2, "q": "A team has a model and tools and wants an open-source SDK to build the agent’s reasoning loop. Hosting will be chosen separately. Which option best fits?", "options": ["Amazon Bedrock AgentCore Runtime", "Amazon Bedrock Knowledge Bases", "Strands Agents", "Amazon Bedrock Prompt Management"], "answer": 2, "why": "Strands is the agent development SDK; runtime hosting, retrieval and prompt storage solve different needs.", "reasons": ["Runtime hosts agent code but is not the requested open-source development SDK.", "Knowledge Bases retrieves information; it does not provide the agent loop SDK.", "Strands Agents is an open-source SDK for constructing model-driven agents with tools.", "Prompt Management stores and versions prompts, a different part of the application."], "clues": [{"text": "open-source SDK", "why": "The question asks for a development framework, not a deployed service."}], "hint": "Separate building the agent loop from hosting, retrieval and prompt versioning.", "analysis": "Strands can define the model/tool loop; AgentCore Runtime can host code built with Strands or another framework.", "trap": "Confusing a framework used to build an agent with managed infrastructure that operates it.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A team can build in Strands locally, then choose a compatible runtime for deployment.", "source": "https://strandsagents.com/docs/", "concept": "Agent framework versus hosting", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["open-source SDK"]}, {"id": 42, "domain": 2, "q": "An agent already works in its chosen framework. The team needs a managed, framework-agnostic environment to host and run that agent without rebuilding its reasoning loop. Which AWS capability is the closest fit?", "options": ["Strands Agents SDK", "Amazon Bedrock AgentCore Runtime", "Amazon Bedrock Knowledge Bases", "Amazon Bedrock Prompt Management"], "answer": 1, "why": "AgentCore Runtime is the managed hosting layer for the existing agent code.", "reasons": ["Strands is a development SDK, not the managed runtime requested.", "AgentCore Runtime hosts and runs agents built with various frameworks.", "Knowledge Bases supports retrieval over data sources, not general agent hosting.", "Prompt Management stores prompts, not the running agent process."], "clues": [{"text": "already works in its chosen framework", "why": "The team wants to operate existing code, not adopt a new framework."}], "hint": "Find the component that hosts the agent while preserving its chosen framework.", "analysis": "AgentCore includes other capabilities, but Runtime specifically addresses hosting. Development frameworks and retrieval services may complement it.", "trap": "Choosing a tool used by the agent rather than the environment that runs the agent.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A customer-support agent built in a third-party framework can run in AgentCore Runtime while using a separate knowledge base.", "source": "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html", "concept": "AgentCore Runtime versus agent SDK", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["already works in its chosen framework"]}, {"id": 43, "domain": 2, "q": "A product team wants an AI development environment that turns a feature request into reviewable requirements, design and implementation tasks before coding. Which tool is the most direct fit?", "options": ["Amazon Bedrock Prompt Management", "Strands Agents", "Amazon Bedrock AgentCore Runtime", "Kiro"], "answer": 3, "why": "Kiro’s spec workflow addresses the requested development process.", "reasons": ["Prompt Management versions model prompts; it does not create a software feature specification workflow.", "Strands builds agents, not the requested software development environment.", "AgentCore Runtime operates agents rather than turning a feature request into a development plan.", "Kiro supports specification-driven software development with requirements, design and tasks."], "clues": [{"text": "reviewable requirements, design and implementation tasks", "why": "These are software specification artifacts rather than agent runtime components."}], "hint": "Match the requested development workflow, not merely any AI-related AWS tool.", "analysis": "A spec-driven workflow structures what will be built and reviewed; it does not remove the need to test the resulting software.", "trap": "Assuming an agent hosting service is also an IDE or spec planning tool.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.3", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A team can use Kiro to plan a billing feature, then review the generated design and test its implementation.", "source": "https://kiro.dev/docs/web/setup/", "concept": "Specification-driven development", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["reviewable requirements, design and implementation tasks"]}, {"id": 44, "domain": 2, "q": "Two models pass a quality threshold on a representative support workload. The smaller model is cheaper but slower for the longest requests; the larger one is faster but costs more. What should the team do before choosing?", "options": ["Choose the largest model because size is a reliable proxy for suitability", "Compare latency and cost distributions against the actual service targets, then choose the fit", "Choose the cheaper model using average cost alone", "Choose the faster model using one demonstration request"], "answer": 1, "why": "Both models pass quality; compare the remaining constraints on representative traffic and service targets.", "reasons": ["Model size is not a substitute for the stated workload measurements.", "The choice depends on tail latency, traffic mix, cost and the agreed service targets.", "An average bill can hide long-request latency that violates the service target.", "One demonstration does not represent the workload or cost distribution."], "clues": [{"text": "slower for the longest requests", "why": "Tail behavior can matter even when average performance looks good."}], "hint": "Use the actual workload and service target rather than a single headline metric.", "analysis": "Measure latency and total cost across realistic request lengths. A model that misses a required latency target is unsuitable even if its average cost is lower.", "trap": "Selecting by model size, average cost or one demo while ignoring the workload distribution.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "2.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain2.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A multilingual chatbot may need separate checks for long translated queries before selecting the cheaper model.", "source": "https://docs.aws.amazon.com/wellarchitected/latest/generative-ai-lens/gencost01-bp01.html", "concept": "Model selection under latency and cost constraints", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["slower for the longest requests"]}, {"id": 45, "domain": 3, "kind": "multi", "q": "A support assistant must use a changing product manual and follow a demonstrated response format. The team will keep the existing model weights and cannot fit the entire manual in one prompt. Which TWO approaches jointly meet the requirements?", "options": ["Retrieve relevant manual passages for each request", "Fine-tune on pairs of customer questions and approved replies", "Include a few demonstrations of the required format in the prompt", "Continue pre-training on the complete manual", "Cache a successful response and reuse it for similar requests"], "answer": [0, 2], "reasons": ["Retrieval selects relevant passages from the manual within the available context; its index must be kept current.", "Fine-tuning can adapt responses but updates model weights, violating the stated constraint.", "Few-shot demonstrations guide the requested format at inference time without training.", "Continued pre-training changes model weights and does not meet the no-training constraint.", "Reused responses can contain stale or mismatched facts and do not jointly provide current evidence and format demonstrations."], "why": "Retrieval supplies relevant manual evidence at request time, while few-shot examples demonstrate the format. Neither approach changes the model’s weights.", "clues": [{"text": "existing model weights", "why": "Eliminate training-based changes."}, {"text": "changing product manual", "why": "The facts must come from updated request-time context."}], "hint": "One approach must supply relevant facts; the other must demonstrate the format without training.", "analysis": "Check both requirements together. Prompt examples show how to respond, while retrieval supplies what the current answer should be based on.", "trap": "Choosing two methods that address style but do not provide fresh product facts.", "reviewedOn": "2026-10-30", "objective": "3.1", "relatedObjectives": ["3.2"], "concept": "RAG plus few-shot prompting", "difficulty": "Applied", "transfer": "A lease assistant can retrieve the relevant contract section and use a few examples to produce a consistent summary format.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "source": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "keyPoints": ["changing product manual", "demonstrated response format", "existing model weights", "cannot fit the entire manual"]}, {"id": 46, "domain": 3, "q": "A model must label sentiment from an instruction with no demonstrations in the prompt. Which prompting technique is this?", "options": ["Few-shot", "Zero-shot", "Distillation", "Continuous pre-training"], "answer": 1, "why": "Zero-shot asks the model to perform the task without demonstrations.", "reasons": ["Few-shot includes a small set of demonstrations.", "Zero-shot asks the model to perform the task without demonstrations.", "Distillation trains a student from a teacher.", "Continuous pre-training changes model parameters with additional training."], "clues": [{"text": "no demonstrations", "why": "Count examples rather than instructions."}], "hint": "An instruction is not the same thing as a worked example.", "analysis": "The task and output can be specified in detail while still being zero-shot if no demonstrations are supplied.", "trap": "Zero-shot does not mean the prompt contains no guidance.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked foundational item; independent expert review pending", "concept": "Zero-shot prompting", "transfer": "Ask for sentiment from an instruction alone, without demonstrations.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-engineering-guidelines.html", "difficulty": "Foundation", "reviewNote": "Introductory concept or service distinction; do not use alone as evidence of exam readiness."}, {"id": 47, "domain": 3, "q": "A document search system should retrieve passages about “ending a lease” when a user asks about “early termination.” Which comparison best supports this semantic match?", "options": ["Compare exact file names only", "Compare document creation dates only", "Compare compatible query and passage embedding vectors", "Compare S3 encryption key names"], "answer": 2, "why": "Vector similarity can retrieve related passages despite different surface wording.", "reasons": ["File names may use different words from the user’s intent.", "Dates measure recency, not semantic relatedness.", "Embeddings can place related meanings near one another for vector search.", "Encryption keys protect data rather than encode document meaning."], "clues": [{"text": "“ending a lease”", "why": "The query and relevant passage may not share exact words."}], "hint": "Choose the representation that can compare meaning across wording differences.", "analysis": "Use a compatible embedding model for both sides and verify the retrieved passage, access permissions and freshness.", "trap": "Assuming exact text matching or metadata alone captures semantic similarity.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "3.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "Embedding-based semantic retrieval", "transfer": "“Cancel my contract” may retrieve a section titled “termination rights” through embedding search.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["“ending a lease”"]}, {"id": 48, "domain": 3, "q": "A 200-page policy manual is indexed for RAG. The assistant needs to answer from the paragraph relevant to each question while keeping the context compact. Why split the manual into passages?", "options": ["To remove the need to track the source document", "To guarantee every answer is factually correct", "To retrieve focused text that fits the model context with source metadata", "To train the model weights each time the policy changes"], "answer": 2, "why": "Chunking supports retrieval of relevant passages w es AWS compliance documents; customer logs and configuration evidence answer different questions.", "reasons": ["CloudTrail records supported account activity; it is not the report portal.", "Config evaluates customer resource configuration against rules.", "Artifact provides access to AWS compliance reports and agreements.", "Macie finds sensitive data in S3, not AWS auditor reports."], "clues": [{"text": "AWS-provided SOC and ISO reports", "why": "The requested artifacts are AWS’s compliance documents."}], "hint": "Separate provider compliance reports from evidence about your own resource behavior.", "analysis": "Obtain AWS reports from Artifact, then assess separately whether the application’s own controls meet the organization’s requirements.", "trap": "Assuming a provider report proves the customer application itself is compliant.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.2", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "concept": "AWS compliance documents versus customer evidence", "transfer": "A procurement review may request AWS SOC reports while also checking the customer’s own access logs.", "source": "https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["AWS-provided SOC and ISO reports"]}, {"id": 64, "domain": 5, "q": "A team uses a managed AWS AI service to process customer records. AWS operates the underlying infrastructure. Who must still decide and enforce which employees may send those records to the service?", "options": ["AWS alone, because the infrastructure is managed", "The customer, through its data-handling rules and appropriately scoped access controls", "The foundation model, based on its confidence in each employee", "The external browser used to view the application"], "answer": 1, "why": "Managed service use retains customer responsibility for data and access choices; exact duties depend on the service.", "reasons": ["Managed infrastructure does not transfer every customer data and identity decision to AWS.", "The customer retains decisions about permitted data use and who can access its resources.", "Model confidence is not an authorization control.", "A browser does not define the organization’s AWS permissions."], "clues": [{"text": "which employees may send those records", "why": "This is an authorization and customer-data governance decision."}], "hint": "Separate infrastructure operation from the customer’s identities, permissions and data policy.", "analysis": "Apply service-specific shared responsibility: AWS secures its infrastructure, while the customer configures appropriate access and data handling for its workload.", "trap": "Assuming managed means all data and access decisions are handled by AWS.", "kind": "single", "reviewedOn": "2026-10-31", "objective": "5.1", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "reviewStatus": "AWS-source-checked; independent expert review pending", "transfer": "A company using managed document analysis still decides who may upload payroll files.", "source": "https://docs.aws.amazon.com/IAM/latest/UserGuide/security.html", "concept": "Shared responsibility for customer data", "difficulty": "Applied", "contentRevision": 2, "keyPoints": ["which employees may send those records"]}, {"id": 65, "domain": 5, "kind": "multi", "q": "An order assistant may read order status but must not issue refunds. Even if an injected instruction makes the model request a refund, which TWO controls independently restrict what can execute?", "options": ["Use a runtime identity whose downstream permissions allow only order lookup", "Put the no-refund rule in the system prompt and inspect its wording during testing", "Authorize each tool call at the execution boundary against an approved read-only action set", "Record refund attempts in an audit log and review them after execution", "Require a high model-confidence score before executing a refund request"], "answer": [0, 2], "reasons": ["The actual credential must lack refund capability; hiding a tool while retaining broad credentials is insufficient.", "Prompt instructions guide behavior but cannot serve as the permission boundary if the model requests a forbidden action.", "The execution layer rejects operations outside the approved read-only set before any side effect occurs.", "Logging helps detection and investigation but does not prevent the prohibited refund.", "A confident unsafe request is still unsafe; a confidence threshold does not authorize an action."], "why": "Least-privilege downstream permissions and execution-time authorization enforce the action boundary even when the model generates an unsafe request.", "clues": [{"text": "restrict what can execute", "why": "The controls must block the action outside the model’s text decision."}], "hint": "Distinguish prevention before a side effect from model guidance and after-the-fact detection.", "analysis": "Trace the request through to the credential and API that would perform it. Both identity permissions and tool authorization must restrict the actual action path.", "trap": "Confusing an instruction, an audit record or model confidence with an enforceable permission.", "reviewedOn": "2026-10-30", "objective": "5.1", "concept": "Least privilege and agent action boundaries", "difficulty": "Applied", "source": "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-permissions.html", "transfer": "A reporting assistant needs read-only access to accounting data even if its prompt says never to edit records.", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practition ficulty": "Applied", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["labeled customer-churn rows"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 67, "domain": 1, "objective": "1.3", "q": "A deployed fraud model was evaluated well at launch. Months later, the transaction mix changes and confirmed fraud is missed more often. What should the team do first?", "options": ["Keep the launch score as proof the model still performs well", "Monitor current inputs and outcomes against a baseline, investigate drift, then decide whether to update the model", "Increase the model endpoint size without evaluating predictions", "Retrain automatically on every new transaction without labels or validation"], "answer": 1, "why": "Production monitoring can reveal changed inputs or quality. Investigate the cause before retraining and validate any update.", "reasons": ["A historical evaluation does not describe current behavior after the data changes.", "Monitoring input and outcome changes provides evidence for a corrective decision.", "More compute capacity does not directly fix deteriorating fraud detection.", "Unvalidated retraining on new traffic can amplify error and lacks the confirmed targets needed for evaluation."], "clues": [{"text": "Months later, the transaction mix changes", "why": "A launch evaluation may no longer represent production data."}], "hint": "Look for evidence about current data and outcomes before choosing a remedy.", "analysis": "Compare recent data and confirmed labels with a suitable baseline. Drift is a signal to investigate, not automatic proof that retraining will help.", "trap": "Treating a good launch score as permanent model quality.", "transfer": "A seasonal demand forecast needs renewed monitoring when customer behavior changes after a e examples", "Use prompt caching to reuse earlier input tokens", "Increase temperature to make responses more varied"], "answer": 1, "why": "Supervised fine-tuning can adapt weights from curated instruction-response examples; the result still needs evaluation.", "reasons": ["Retrieval supplies context at request time; it does not train the behavior described.", "Fine-tuning uses task examples to adapt model weights, subject to suitable data and evaluation.", "Prompt caching may reduce repeated input processing but does not adapt weights.", "More sampling variation does not train the desired response pattern."], "clues": [{"text": "evaluate a weight update", "why": "The scenario calls for a training-based change rather than only runtime prompting."}], "hint": "Separate a change to model weights from examples supplied with each request.", "analysis": "Because prompt-only examples have not met the behavior requirement, the team is considering training with approved examples. Evaluate whether fine-tuning improves the target task enough to justify its cost.", "trap": "Assuming retrieval or prompt caching changes model weights.", "transfer": "A support classifier can be tuned on approved input/output examples after prompt-only trials fail its consistency target.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/custom-model-fine-tuning.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain3.html", "concept": "Instruction-response fine-tuning", "difficulty": "Applied", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 2, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["Prompt examples alone", "evaluate a weight update"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 73, "domain": 4, "objective": "4.2", "q": "A credit decision model has strong overall accuracy, but affected applicants need understandable reasons and a way to contest mistakes. What should the team prioritize?", "options": ["Publish all private training records to make the model transparent", "Measure whether the explanations are useful and protect sensitive details while enabling human review", "Provide only a confidence score and treat it as the final decision", "Hide every reason because accuracy is already high"], "answer": 1, "why": "Useful explanations and a review path support affected people; transparency must be balanced with privacy.", "reasons": ["Exposing private training data would create a separate privacy harm.", "Measure explanation usefulness and provide protected, meaningful review.", "Confidence alone does not explain or correct an individual decision.", "Overall accuracy does not answer the applicant’s need for reasons or correction."], "clues": [{"text": "understandable reasons and a way to contest mistakes", "why": "The outcome affects a person who needs an actionable explanation."}], "hint": "Consider both the person’s review needs and the data that must stay protected.", "analysis": "Test what an affected user can understand and challenge; protect personal data while evaluating the model and explanation tradeoffs.", "trap": "Equating a high aggregate score with accountability for individual decisions.", "transfer": "An AI-assisted benefits decision should give understandable grounds and a human correction route without disclosing another applicant’s data.", "source": "https://docs.aws.amazon.com/wellarchitected/latest/responsible-ai-lens/rairc04-bp02.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain4.html", "concept": "Explainability, privacy and human review", "difficulty": "Applied", "kind": "single", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["understandable reasons and a way to contest mistakes"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 74, "domain": 5, "objective": "5.1", "q": "A team handles sensitive training files in S3 and calls a managed AI service. Which TWO controls address data protection in transit and at rest most directly?", "options": ["Use TLS for supported connections between components", "Give every user administrator permissions to avoid access errors", "Use appropriate server-side encryption for stored files and manage key access", "Rely on a system prompt that tells the model to keep data secret", "Store the same data in a public bucket to simplify retrieval"], "answer": [0, 2], "why": "TLS protects supported traffic in transit, while at-rest encryption and key controls protect stored data.", "reasons": ["TLS addresses interception of supported network traffic.", "Broad permissions increase exposure rather than protecting the data.", "Encryption at rest and controlled key access address stored-data protection.", "A prompt is not a substitute for storage or transport security.", "Public access conflicts with sensitive-data protection."], "clues": [{"text": "in transit and at rest", "why": "Two separate protection states are named."}], "hint": "Choose one transport control and one storage control.", "analysis": "Also apply least privilege and verify each service’s actual encryption configuration; encryption is not a permission system.", "trap": "Thinking a model instruction can enforce infrastructure security.", "transfer": "A medical-document workflow needs protected transport and encrypted storage plus access policies for the right staff.", "source": "https://docs.aws.amazon.com/bedrock/latest/userguide/data-encryption.html", "objectiveSource": "https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01-domain5.html", "concept": "Encryption in transit and at rest", "difficulty": "Applied", "kind": "multi", "reviewedOn": "2026-10-31", "contentRevision": 1, "reviewStatus": "AWS-source-checked; independent expert review pending", "keyPoints": ["in transit and at rest"], "reviewNote": "Second internal challenge checked the key, closest competing choice and scenario constraints; independent subject review pending."}, {"id": 75, "domain": 5, "objective": "5.2", "q": "A company must keep AI interaction logs for a defined period and keep regulated data in an approved Region. Which governance plan best addresses both requirements?", "options": ["Pick a model with a large context window and leave logging defaults unchanged", "Document the retention rule and approved Region, configure the relevant services, and review evidence regularly", "Ask the model to remember the retention policy without configuring storage", "Keep all logs indefinitely in any Region because longer retention is always safer"], "answer": 1, "why": "Governance needs explicit retention and residency requirements, service configuration and recurring verification.", "reasons": ["Context length does not set log retention or data location.", "The policy, configuration and review process address both stated constraints.", "A prompt cannot enforce the storage lifecycle or Region.", "Unlimited retention and arbitrary residency may violate the stated requirements."], "clues": [{"text": "defined period", "why": "The control must implement a specific lifecycle rather than merely collecting logs."}], "hint": "Identify both where data is kept and how long it remains, then how compliance is checked.", "analysis": "Service choices and configurations must reflect the organization’s actual legal and contractual obligations; document the review cadence.", "trap": "Treating a written policy or a model instruction as an implemented governance control.", "transfer": "A support workflow can set a documented log expiry and verify that its storage stays i function reviewTiming(){if(dueReviews().length)return 'Ready to review now.';const next=nextReview();if(!Number.isFinite(next))return 'Nothing scheduled yet.';const hours=Math.ceil((next-Date.now())/3600000);return `Next review in ${hours<24?hours+' hour'+(hours===1?'':'s'):Math.ceil(hours/24)+' day'+(hours<=24?'':'s')}.`}

 if(!reveal)return esc(q.q);
