name: App checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 sync_content.py
      - run: python3 export_review_sheet.py
      - run: git diff --exit-code -- Preview.html app/src/main/assets/index.html review_sheet.csv
      - run: node verify.cjs
      - run: node test-home-welcome.cjs
      - run: node test-browser.cjs
      - run: node test-zamify.cjs
      - run: node test-catalogue.cjs
      - run: node test-regressions.cjs
      - run: python3 prepare_release.py
      - run: node test-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-output/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 sync_content.py
      - run: python3 export_review_sheet.py
      - run: ./gradlew assembleDebug assembleRelease bundleRelease lintRelease --no-daemon
      - run: python3 verify_release.py
      - run: python3 build-test-apk.py
      - run: python3 sign-test-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Zamify-0.9-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
            test-build/Zamify_Test.apk
            test-build/Zamify_Release_Test.apk
            app/build/reports/lint-results-release.html

  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 33, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Zamify-0.9-builds
          path: test-input
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test debug and optimized release APKs
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            python3 test-android.py --apk test-input/app/build/outputs/apk/debug/app-debug.apk
            python3 test-android.py --apk test-input/test-build/Zamify_Release_Test.apk --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-qa-api-${{ matrix.api-level }}
          path: test-output/android/
