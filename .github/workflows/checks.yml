name: App checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node verify.cjs
      - run: node test-home-welcome.cjs
      - run: node test-browser.cjs
      - run: node test-zamify.cjs
      - run: node test-catalogue.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-output/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew assembleDebug bundleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zamify-0.8-debug
          path: app/build/outputs/apk/debug/app-debug.apk
