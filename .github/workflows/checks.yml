name: App checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 sync_content.py
      - run: python3 export_review_sheet.py
      - run: git diff --exit-code -- Preview.html app/src/main/assets/index.html review_sheet.csv
      - run: node verify.cjs
      - run: node test-home-welcome.cjs
      - run: node test-browser.cjs
      - run: node test-zamify.cjs
      - run: node test-catalogue.cjs
      - run: python3 prepare_release.py
      - run: node test-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-output/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 sync_content.py
      - run: python3 export_review_sheet.py
      - run: ./gradlew assembleDebug bundleRelease lintRelease --no-daemon
      - run: python3 verify_release.py
      - run: python3 build-test-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: Zamify-0.9-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
            test-build/Zamify_Test.apk
            app/build/reports/lint-results-release.html
